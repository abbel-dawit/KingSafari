      ${Rules.GAMES_PLAYABLE.map(id => `<button role="tab" aria-selected="${id === g}" data-game="${id}">
        <span class="tab-art">${artFor(id, id === 'chess' ? 'wN' : 'wM')}</span>
        <b>${gname(id)}</b></button>`).join('')}
    </div>
    <div class="card" style="padding:16px; margin-top:12px">
      <div class="between" style="margin-bottom:9px"><b style="font-family:var(--font-d); font-size:16px">${t('Your progress')}</b><span class="tiny">${t('{n} of {total} lessons', { n: done, total })}</span></div>
      <div class="bar"><i style="width:${done/total*100}%"></i></div>
    </div>
    ${PIECE_LESSONS.length ? `<div class="sec-h">${t('How each piece moves')}</div>
    <div class="piece-cards">
      ${PIECE_LESSONS.map(([i,p,label], n) => `<button class="piece-card" data-les="${i}">
        ${st.lessons.includes(i) ? `<span class="tick" aria-label="${t('Finished')}">✓</span>` : ''}
        <div class="sqr">${artFor(g, (n % 2 === 0 ? 'b' : 'w') + p)}</div><b>${t(label)}</b></button>`).join('')}
    </div>` : ''}
    <div class="sec-h">${g === 'chess' ? t('Rules and tactics') : t('How checkers works')}</div>
    <div class="stack">${rules}</div>
  </div></div>${tabbar('learn')}`);
  $$('[data-les]').forEach(b => b.onclick = () => go('lesson', {i: +b.dataset.les}));
  $$('[data-game]').forEach(b => b.onclick = () => { setGameId(b.dataset.game); beep('tap'); go('learn'); });
};

/* A lesson: read the explanation, then show you understand it with three correct moves in a row (a wrong move starts
   the count again). After that the board stays yours: keep moving your own pieces to practice as long as you like.
   The engine checks every answer. */
SCREENS.lesson = () => {
  const g = gameId0(), Game = GAMES[g], list = LESSONS[g];
  const i = view.data.i, L = list[i], task = L.task, rounds = lessonRounds(g, i);
  const already = ST(g).lessons.includes(i), next = i + 1 < list.length ? i + 1 : null;
  const totalMoves = rounds.reduce((n, r) => n + r.steps.filter(x => x.goal !== 'promote').length + (r.steps.some(x => x.goal === 'promote') ? 1 : 0), 0);
  screen(`${appbar(t(L.t), g === 'chess' ? t('Chess lesson {n} of {total}', { n: i + 1, total: list.length }) : t('Checkers lesson {n} of {total}', { n: i + 1, total: list.length }), 'learn')}
  <div class="scroll"><div class="wrap wide lesson-layout">
    <div class="board-wrap"><div class="lesson-board">
      <div class="board-stage"><div class="board" id="lb"></div></div>
      <div class="lesson-under">
        <div class="streak" id="lstreak" aria-live="polite"></div>
        <div class="task" id="ltask" aria-live="polite"></div>
        <div class="row" style="gap:6px; justify-content:center; flex-wrap:wrap">
          <button class="btn flat sm" id="lreset">${t('Reset the position')}</button>
          <button class="btn flat sm" id="lfree" ${already ? '' : 'hidden'}>${t('Free practice')}</button>
        </div>
      </div>
    </div></div>
    <div class="lesson-text">
      <div class="prose">${L.p.map(x => `<p>${esc(t(x))}</p>`).join('')}</div>
      <p class="tiny" style="margin:0 0 10px">${totalMoves > 1 ? t('Show you understand: make {n} correct moves in a row. A wrong move starts the count again.', { n: totalMoves }) : t('Show you understand: make the winning moves.')}</p>
      <button class="btn go" id="fin" style="margin-top:6px" ${already ? '' : 'disabled'}>
        ${already ? (next != null ? t('Next lesson') : t('Back to lessons')) : t('Solve the task to finish (+{n} XP)', { n: Rules.LESSON_XP })}</button>
    </div>
  </div></div>`);

  const board = createBoard($('#lb'), g), box = $('#ltask'), fin = $('#fin'), streakEl = $('#lstreak');
  const sizeIt = () => fitBoard($('#lb'), { holder: $('.lesson-board'), below: [$('.lesson-under')], max: 600, min: 150, pad: 14 });
  refit(sizeIt);
  const posOf = r => r.fen ? Game.fromFen(r.fen) : r.pos ? Game.setup(r.pos) : Game.start();
  let s, sel, path = null, step, round = 0, streak = 0, solved = false, busyBoard = false, practice = false, steps = rounds[0].steps;
  const pawnArt = artFor(g, g === 'chess' ? 'wP' : 'wM');
  const say = (icon, text, cls, vars) => { box.className = 'task' + (cls ? ' ' + cls : '');
    const ic = icon === '♟' ? `<span class="dotc pawn" aria-hidden="true">${pawnArt}</span>` : `<span class="dotc">${icon}</span>`;
    box.innerHTML = `${ic}<span>${esc(t(text, vars))}</span>`; };
  const drawStreak = () => {
    if (practice){ streakEl.innerHTML = `<span class="practice-chip"><span class="pawn-ic" aria-hidden="true">${pawnArt}</span>${t('Free practice')}</span>`; return; }
    if (totalMoves < 2){ streakEl.innerHTML = ''; return; }
    streakEl.innerHTML = Array.from({ length: totalMoves }, (_, k) => `<i class="${k < streak ? 'on' : ''}"></i>`).join('')
      + `<span style="margin-left:6px">${t('{n} of {total} in a row', { n: streak, total: totalMoves })}</span>`;
  };
  /* in practice white keeps the move: only your own pieces move, and a king is never "captured" */
  const legalNow = () => practice ? Game.legal(s).filter(m => !(s.b[m.to] && s.b[m.to][1] === 'K' && Game.id === 'chess')) : Game.legal(s);
  const loadRound = (r, keepStreak) => {
    round = r; steps = rounds[r].steps; s = posOf(rounds[r]); sel = null; step = 0; busyBoard = false; path = null;
    if (!keepStreak) streak = 0;
    board.setPosition(s); board.setMarks({}); say('👆', steps[0].hint); drawStreak();
  };
  const reset = () => { solved = false; practice = false; loadRound(0); };
  const fail = text => {
    busyBoard = true; say('✕', text, 'bad'); beep('lose');
    const had = streak; streak = 0; drawStreak();
    setTimeout(() => {
      if (view.screen !== 'lesson' || view.data.i !== i) return;
      loadRound(0);
      if (had && totalMoves > 1) say('👆', 'Start again: {n} correct moves in a row.', '', { n: totalMoves });
      setTimeout(() => { if (view.screen === 'lesson' && view.data.i === i && !practice && !solved && step === 0) say('👆', steps[0].hint); }, 1600);
    }, 1500);
  };
  const enterPractice = (fromStart) => {
    practice = true; busyBoard = false; sel = null; path = null;
    if (fromStart){ s = posOf(rounds[0]); board.setPosition(s); }
    s = Object.assign({}, s, { turn: 'w', ep: null });
    board.setMarks({}); drawStreak();
    say('♟', 'Free practice: keep moving your own pieces as much as you like. Tap Reset the position to start over.');
    $('#lfree').hidden = true;
  };
  const succeed = () => {
    solved = true; busyBoard = true; say('✓', task.done, 'ok'); beep('win'); drawStreak();
    if (!already && !ST(g).lessons.includes(i)){ fin.disabled = false; fin.textContent = t('Finish lesson (+{n} XP)', { n: Rules.LESSON_XP }); }
    setTimeout(() => { if (view.screen === 'lesson' && view.data.i === i && solved && !practice) enterPractice(false); }, 1900);
  };
  const roundDone = () => {
    if (round + 1 >= rounds.length) return succeed();
    busyBoard = true; beep('coin');
    say('✓', 'Correct! {n} of {total} in a row. Here is the next one.', 'ok', { n: streak, total: totalMoves });
    setTimeout(() => { if (view.screen === 'lesson' && view.data.i === i && !solved) loadRound(round + 1, true); }, 1100);
  };
  const blackReplies = then => {
    busyBoard = true;
    setTimeout(() => {
      const before = s, mv = Game.botMove(s, 4);
      if (!mv) return fail('Black has no legal moves left, so the position is finished. Try again.');
      s = Game.apply(s, mv); board.animate(Game.anim(before, mv), s); board.setMarks({ last: mv }); beep('move');
      busyBoard = false; then();
    }, 650);
  };
  const meets = (st, before, m, after) => {
    switch (st.goal){
      case 'any': return true;
      case 'moves': return st.moves.includes(Game.toUci(m));
      case 'capture': return !!(m.cap || m.ep || (m.caps && m.caps.length));
      case 'mate': return Game.status(after).type === 'mate';
      case 'develop': return 'NB'.includes(before.b[m.from][1]);
      case 'crown': return !!m.promo;
    }
    return false;
  };
  /* a practice move: play it, and give white the move again */
  const practiceMove = m => {
    const before = s;
    s = Object.assign({}, Game.apply(before, m), { turn: 'w', ep: null }); sel = null; path = null;
    board.animate(Game.anim(before, m), s); board.setMarks({ last: m });
    beep(m.cap || (m.caps && m.caps.length) ? 'cap' : 'move');
    if (!legalNow().length) say('♟', 'No more moves for white here. Tap Reset the position to start over.');
  };

  board.onSquare(idx => {
    if (busyBoard || (solved && !practice) || Game.turnOf(s) !== 'w') return;
    const legal = legalNow();
    const from = path ? path[0] : sel;
    if (from != null){
      const want = (path || [sel]).concat(idx);
      const matches = legal.filter(m => (m.path || [m.from, m.to]).slice(0, want.length).join() === want.join());
      const exact = matches.filter(m => (m.path || [m.from, m.to]).length === want.length);
      if (exact.length && matches.length === exact.length){
        const m = exact.find(x => !x.promo || x.promo === 'Q' || Game.id === 'checkers') || exact[0];
        if (practice) return practiceMove(m);
        const before = s, st = steps[step];
        s = Game.apply(s, m); sel = null; path = null;
        board.animate(Game.anim(before, m), s); board.setMarks({ last: m }); beep('move');
        if (st.goal === 'promote'){
          if (m.promo){ streak = totalMoves; return succeed(); }
          if (!s.b.includes('wP')) return fail('The pawn is gone, so white can no longer win. Try again.');
          if (Game.status(s).over) return fail('That is stalemate: black cannot move, so the game is a draw. Try again.');
          return blackReplies(() => {
            if (!s.b.includes('wP')) return fail('Black captured the pawn. Keep your king next to it. Try again.');
            say('👆', st.hint);
          });
        }
        if (!meets(st, before, m, s)) return fail(st.wrong || 'Not quite. Try again.');
        streak++; step++; drawStreak();
        if (step === steps.length) return roundDone();
        if (task.reply) return blackReplies(() => say('👆', steps[step].hint));
        say('👆', steps[step].hint); return;
      }
      if (matches.length){ path = want; sel = want[want.length - 1]; beep('tap'); return showHints(); }
    }
    const p = s.b[idx];
    if (p && p[0] === 'w' && sel !== idx){
      if (!legal.some(m => m.from === idx) && legal.some(m => m.caps && m.caps.length)){
        sel = null; path = null; beep('lose');
        board.setMarks({ hints: legal.filter(m => m.caps.length).map(m => ({ to: m.from, cap: true })) });
        return toast(t('A jump is available, so you have to take it.'));
      }
      sel = idx; path = null; beep('tap'); showHints();
    }
    else { sel = null; path = null; board.setMarks({}); }
  });
  function showHints(){
    const want = path || [sel];
    board.setMarks({ sel, hints: legalNow()
      .filter(m => (m.path || [m.from, m.to]).slice(0, want.length).join() === want.join())
      .map(m => ({ to: (m.path || [m.from, m.to])[want.length], cap: !!(m.cap || m.ep || (m.caps && m.caps.length)) }))
      .filter(h => h.to != null) });
  }
  $('#lreset').onclick = () => {
    if (practice){ enterPractice(true); return; }
    if (solved) return reset();
    loadRound(round, true);                                  // the same position again; the count so far is kept
  };
  $('#lfree').onclick = () => { solved = true; enterPractice(true); };
  fin.onclick = () => busy(fin, async () => {
    if (!ST(g).lessons.includes(i)){
      if (!solved) return;
      const r = await Backend.lessonDone(g, i); setPlayer(r.player);
      toast(r.levelsGained ? t('Lesson finished — you reached level {n}', { n: P.level }) : t('Lesson finished. +{n} XP', { n: Rules.LESSON_XP }));
      beep('coin');
    }
    next != null ? go('lesson', { i: next }) : go('learn');
  });
  reset();
};

/* ===== wallet + telebirr ===== */
const txIcon = x => ({ welcome:'🎁', purchase:'💳', stake:'🎯', payout:'🏆', refund:'↩️', cashout:'🏦', cashout_reversal:'↩️', forfeit:'⛔', adjustment:'🛠️' }[x.kind]
  || (x.amount > 0 ? '💳' : '🎯'));
const cashoutState = x => x.status === 'held' ? t('Cash-out under review') : x.status === 'processing' ? t('Cash-out being sent') : t('Cash-out on its way');

SCREENS.wallet = () => {
  screen(`${appbar(t('Wallet'), t('Tokens for the ranked tables'), 'home')}
  <div class="scroll"><div class="wrap wide" style="max-width:940px"><div class="two-col">
    <div>
      <div class="card" style="text-align:center; padding:26px 20px 22px">
        <div class="tiny" style="font-weight:700">${t('Cashable balance')}</div>
        <div class="bal" style="margin:10px 0 6px">${coinSVG()}<span id="balN">${fmt(P.tokens)}</span></div>

/* resize a camera photo in the browser: at most 1400 px on the long side, JPEG, so it uploads quickly on 3G */
function shrinkPhoto(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 1400 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = .82, out = c.toDataURL('image/jpeg', q);
      while (out.length > 1.1e6 && q > .4){ q -= .12; out = c.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}

/* the steps before every ranked search: the fair-play pledge and the connection rules (once per version, stored by
   the server), then a connection check (every time) */
function beginRanked(stake, game){
  if (!P.fairPlayAccepted) return fairPlayPledge(() => beginRanked(stake, game));
  if (!P.connectionAccepted) return connectionRulesSheet(() => beginRanked(stake, game));
  connectionCheck(() => startSearch(stake, game), () => beginRanked(stake, game));
}

/* The connection check before every ranked search, measured from this device. The server repeats its own check
   when the search starts, and that one decides. */
async function connectionCheck(then, retry){
  const C = Rules.CONNECTION, n = C.PROBES + 1;
  let cancelled = false;
  const bg = sheet(`<div class="net-check" id="netCheck">
      <div class="nc-ic">${ICONS.wifi}</div>
      <h2>${t('Checking your connection…')}</h2>
      <p class="muted">${t('Ranked matches need a stable connection from the first move to the last.')}</p>
      <div class="nc-bars" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i data-i="${i}"></i>`).join('')}</div>
      <div class="tiny" id="ncInfo">&nbsp;</div>
    </div>
    <button class="btn flat" id="ncCancel">${t('Cancel')}</button>`);
  $('#ncCancel').onclick = () => { cancelled = true; closeSheet(); };
  const r = await Live.checkConnection((i, rtt) => {
    const b = $(`.nc-bars i[data-i="${i}"]`); if (b) b.className = rtt == null ? 'lost' : rtt > C.WARN_RTT_MS ? 'slow' : 'ok';
    const info = $('#ncInfo'); if (info && rtt != null) info.textContent = t('{n} ms', { n: rtt });
  });
  if (cancelled || !document.body.contains(bg)) return;
  netResult(r, then, retry);
}
/* what the check found: good continues by itself; fair asks; poor or offline stops */
function netResult(r, then, retry){
  const C = Rules.CONNECTION, ms = r.rtt != null ? t('{n} ms', { n: r.rtt }) : '—';
  const facts = r.sent ? t('Round trip {ms} · {a} of {n} answered', { ms, a: r.answered, n: r.sent }) : '';
  if (r.quality === 'good'){
    const box = $('#netCheck');
    if (box){
      box.classList.add('good');
      box.querySelector('h2').textContent = t('Your connection is stable');
      $('#ncInfo').textContent = facts;
    }
    setTimeout(() => { if (document.getElementById('netCheck')) then(); }, 750);
    return;
  }
  const fair = r.quality === 'fair', offline = r.quality === 'offline';
  sheet(`<div class="net-check ${fair ? 'fair' : 'poor'}">
      <div class="nc-ic">${fair ? ICONS.wifi : ICONS.wifiOff}</div>
      <h2>${offline ? t('You are offline') : fair ? t('Your connection is slow') : t('Your connection is not stable enough')}</h2>
      <p class="muted">${fair
        ? t('You can play, but a slow connection drops more easily. If it drops for more than {n} seconds, you forfeit the match and your stake.', { n: C.GRACE_S })
        : t('Ranked matches need a stable connection, so you cannot join one right now. Your tokens are safe: no match was started.')}</p>
      ${facts ? `<div class="tiny" style="margin-top:6px">${facts}</div>` : ''}
      ${fair ? '' : `<ul class="rules" style="text-align:left; margin-top:12px">
        <li>${t('Move to a place with a stronger signal.')}</li>
        <li>${t('Switch to Wi-Fi or 4G.')}</li>
        <li>${t('Check that you have data left in your bundle.')}</li>
        <li>${t('Close other apps that are downloading.')}</li></ul>`}
    </div>
    <div class="stack" style="margin-top:14px">
      ${fair ? `<button class="btn go" id="ncGo">${t('Play anyway')}</button>` : ''}
      <button class="btn${fair ? '' : ' go'}" id="ncAgain">${t('Check again')}</button>
      ${fair ? '' : `<button class="btn" data-go-bots>${t('Play bots instead')}</button>`}
      <button class="btn flat" data-close>${t('Not now')}</button></div>`);
  if ($('#ncGo')) $('#ncGo').onclick = () => then();
  $('#ncAgain').onclick = () => (retry ? retry() : connectionCheck(then));
  const bots = $('[data-go-bots]'); if (bots) bots.onclick = () => { closeSheet(); go('bots'); };
}

/* matchmaking: the searching sheet stays up until the server pairs us or we cancel */
let search = null;                                   // { stake, since, timer }
let lastSearch = null;                               // to start again after a failed connection check
function startSearch(stake, game){
  if (spendable() < stake) return toast(t('Not enough tokens for that table'));
  search = { stake, game, since: Date.now(), timer: null };
  lastSearch = { stake, game };
  const bg = sheet(`<div class="searching">
      <div class="radar"><div style="font-size:40px">${P.avatar}</div></div>
      <b style="font-family:var(--font-d); font-size:19px">${t('Looking for an opponent…')}</b>
      <div class="tiny" id="searchInfo">${t('{game} · {n}-token table · players near {r}', { game: gname(game), n: stake, r: ST(game).rating })}</div>
      <div class="tiny" id="searchTime">0:00</div>
      <div class="tiny" id="searchFair" style="margin-top:6px">${t('Searching within ±{n} rating', { n: Rules.matchWindow(0) })}</div>
      <div class="tiny net-line" id="searchNet">${ICONS.wifi}<span>${t('Checking your connection…')}</span></div>
      <div class="note" id="searchOnline" style="margin-top:8px; text-align:center" hidden></div></div>
    <div class="stack">
      ${Backend.mode === 'local' ? `<button class="btn" id="vsComputer" hidden>${t('Play the practice opponent (computer) instead')}</button>` : ''}
      <button class="btn" id="stopSearch">${t('Cancel')}</button></div>`);
  bg.addEventListener('click', e => { if (e.target === bg) stopSearch(); }, true);
  $('#stopSearch').onclick = stopSearch;
  if ($('#vsComputer')) $('#vsComputer').onclick = () => { $('#vsComputer').disabled = true; Live.playComputer && Live.playComputer(); };
  search.timer = setInterval(() => {
    const el = $('#searchTime'); if (!el || !search) return;
    const sec = Math.floor((Date.now() - search.since) / 1000);
    el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    const w = Math.min(Rules.matchWindow(Date.now() - search.since), search.provisional ? Rules.MATCH.PROVISIONAL_GAP : Infinity);
    if (sec >= 12 && $('#vsComputer') && search.online) $('#vsComputer').hidden = false;    // waiting a while: offer the computer, never force it
    const fair = $('#searchFair'); if (!fair) return;
    fair.textContent = w < Rules.MATCH.MAX_GAP && !(search.provisional && w >= Rules.MATCH.PROVISIONAL_GAP)
      ? t('Searching within ±{n} rating', { n: w })
      : t('For a fair game you are only matched with players within ±{n} of your rating.', { n: w })
        + (sec >= 90 ? ' ' + t('Few players near your rating are online right now. Keep waiting, try another table, or practice against a bot.') : '');
  }, 1000);
  Live.queue(stake, game);
}
function stopSearch(){
  if (!search) return;
  clearInterval(search.timer); search = null; Live.cancel(); closeSheet();
}
function onMatchmaking(msg){
  if (msg.t === 'conncheck'){                          // the server's own connection check, when the search starts
    const el = $('#searchNet span');
    if (el && msg.ok) el.textContent = t('Connection checked · {n} ms', { n: msg.rtt });
    return;
  }
  if (msg.t === 'queued' && search){
    search.provisional = !!msg.provisional;
    if ('online' in msg){
      search.online = !!msg.online;
      const box = $('#searchOnline');
      if (box){
        box.hidden = false;
        box.innerHTML = msg.online
          ? `<span class="pulse-dot" aria-hidden="true"></span>${t('Looking for real players online at this table. Keep this screen open: the match starts as soon as someone near your rating joins.')}`
          : msg.failed ? t('Online play cannot be reached from here right now, so your opponent is the practice computer.')
          : t('Online play is not available on this device or connection, so your opponent is the practice computer.');
      }
    }
    const info = $('#searchInfo');
    if (info && msg.matchRating && msg.matchRating !== msg.rating)
      info.textContent = t('{game} · {n}-token table · matched as {r} (your best rating minus {m})', { game: gname(search.game), n: search.stake, r: msg.matchRating, m: Rules.MATCH.SANDBAG_MARGIN });
    return;
  }
  if (msg.t === 'unqueued'){
    if (search){ clearInterval(search.timer); search = null; closeSheet(); }
    if (msg.code === 'connection_unstable' && lastSearch){
      const { stake, game } = lastSearch;
      netResult({ quality: 'poor', rtt: null, answered: 0, sent: 0 }, () => startSearch(stake, game), () => beginRanked(stake, game));
      return;
    }
    if (msg.code === 'subscription_required'){ onSubscriptionRequired(); return; }   // the server's Game Center gate
    if (msg.error) toast(msg.error);
    return;
  }
  if (msg.t === 'matched'){
    if (search){ clearInterval(search.timer); search = null; }
    const m = msg.match;
    beep('coin');
    const fromBonus = Math.min(P.bonus || 0, m.stake); P.bonus = (P.bonus || 0) - fromBonus; P.tokens -= m.stake - fromBonus;
    sheet(`<div class="grab"></div>
      <h2 class="center">${t('Opponent found')}</h2>
      <div class="vs">
        <div><span class="av won">${P.avatar}</span><b>${esc(P.name)}</b><span class="tiny">${ST(m.game).rating}</span></div>
        <div class="vs-x">${t('vs')}</div>
        <div><span class="av">${esc(m.opp.avatar)}</span><b>${esc(tServer(m.opp.name))}${m.opp.computer ? '' : ' 🇪🇹'}</b><span class="tiny">${m.opp.rating}</span></div>
      </div>
      <p class="tiny center" style="margin:10px 0 0">${t('{game} · {pot}-token pool · {side}', { game: gname(m.game), pot: m.pot, side: m.my === 'w' ? t('you play White and move first') : t('you play Black') })}</p>
      <div class="note net-found">${ICONS.wifi}<span>${t('Stay connected. If either player’s connection drops, they have {n} seconds to reconnect, or they forfeit.', { n: Rules.CONNECTION.GRACE_S })}</span></div>`, true);
    setTimeout(() => { closeSheet(); startGame({ mode: 'ranked', match: m }); }, 2600);
  }
}

/* ===== Play Friends (junior accounts only) =====
   A junior makes a code, shown as a QR code and a link; a friend with a junior account scans it (or types the code) and
   the game starts on both phones, anywhere with internet. No tokens, no ratings, no chat. The server
   (server/src/game/friends.js) refuses adult accounts on both sides. */
const friendState = { invite: null, active: null, peek: null };
const FRIEND_KEY = 'ks:friendCode';
const fmtCode = c => String(c || '').replace(/^(.{3})(.{3})$/, '$1 $2');
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
/* a code from a link (…?friend=K7Q4MX) or typed/scanned text */
function codeFrom(text){
  const s = String(text || '').trim();
  try{ const u = new URL(s); const c = u.searchParams.get('friend'); if (c) return cleanCode(c); }catch(e){}
  const c = cleanCode(s);
  return /^[A-HJ-NP-Z2-9]{6}$/.test(c) ? c : null;
}
/* opened from a friend's QR code: keep the code until this player can use it (signed in, junior, consent given) */
(function(){
  try{
    const q = new URLSearchParams(location.search), c = q.get('friend');
    if (!c) return;
    lsSet(FRIEND_KEY, cleanCode(c));
    q.delete('friend');
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
  }catch(e){}
})();
function pendingFriendCode(){
  const c = lsGet(FRIEND_KEY, null);
  return c;
}
function takeFriendCode(){ const c = lsGet(FRIEND_KEY, null); lsSet(FRIEND_KEY, null); return c; }

/* the server's answers */
function onFriendInvite(msg){
  if (msg.t === 'friend_peek'){ friendState.peek = msg.invite; return joinSheet(msg.invite); }
  friendState.invite = msg.invite;
  if (msg.expired) toast(t('Your code expired. Make a new one when your friend is ready.'));
  if (view.screen === 'friends') drawFriendInvite();
}
function onFriendState(match){
  friendState.active = match;
  if (match && match.status === 'active' && view.screen === 'friends') drawFriendResume();
}

/* ---------- scanning a QR code with the camera (where the browser can: BarcodeDetector) ---------- */
const scanSupported = () => typeof window.BarcodeDetector === 'function' && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
async function scanSheet(onCode){
  let stream = null, stop = false;
  const end = () => { stop = true; if (stream) stream.getTracks().forEach(x => x.stop()); };
  sheet(`<h2>${t('Scan your friend’s code')}</h2>
    <div class="scan-box"><video id="scanV" playsinline muted></video><div class="scan-frame" aria-hidden="true"></div></div>
    <p class="tiny center" id="scanMsg" style="margin:10px 0 0">${t('Point the camera at the QR code on your friend’s phone.')}</p>
    <button class="btn" id="scanClose" style="margin-top:12px">${t('Close')}</button>`);
  $('#scanClose').onclick = () => { end(); closeSheet(); };
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const v = $('#scanV'); if (!v){ end(); return; }
    v.srcObject = stream; await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const loop = async () => {
      if (stop || !document.body.contains(v)) return end();
      try{
        const found = await det.detect(v);
        for (const f of found){ const c = codeFrom(f.rawValue); if (c){ end(); closeSheet(); beep('coin'); return onCode(c); } }
      }catch(e){}
      setTimeout(loop, 250);
    };
    loop();
  }catch(e){
    const m = $('#scanMsg'); if (m) m.textContent = t('The camera could not be opened. Type the code instead, or scan it with your phone’s camera app.');
  }
}

  });
};

/* Closing an account is final, so it takes two steps and never hides what it costs. */
function closeAccountStart(){
  const cash = P.tokens || 0, bonus = P.bonus || 0;
  if (cash + bonus > 0){
    sheet(`<h2>${t('Cash out first?')}</h2>

/* ===== boot ===== */
(async function boot(){
  applyTheme(prefs.theme); applyBoard(prefs.board);
  SCREENS.splash();
  const t0 = Date.now();
  await initBackend();
  Live.on(onLive);
  if (Backend.mode === 'remote') SuperApp.installMock();       // testing only, and only when the server allows it
  const me = await Backend.restore();
  if (me) setPlayer(me);
  const superStart = await superAppSignIn();                     // inside the telebirr SuperApp (Game Center)
  if (disabledNotice){                                // the server refused this session: the account is disabled
    const sp0 = $('#sp'); if (sp0) sp0.classList.add('out');
    await wait(350); return go('disabled', disabledNotice);
  }
  await wait(Math.max(0, 1300 - (Date.now() - t0)));
  const sp = $('#sp'); if (sp) sp.classList.add('out');
  await wait(350);
  const payment = new URLSearchParams(location.search).get('payment');
  if (payment) history.replaceState(null, '', location.pathname);
  if (superStart && superStart.go) return go(superStart.go, superStart.data);
  if (!P) return go('welcome');
  if (!P.name) return go('setup', { suggestedName: superStart && superStart.suggestedName });
  if (needsDetails()) return go('complete', { next: payment ? 'wallet' : 'home' });
  if (payment) return awaitPayment(payment);
  go('home');
  addEventListener('resize', () => { const c = document.getElementById('fx'); c.width = innerWidth; c.height = innerHeight; });
  // switches and the maintenance message can change while the app is open
  setInterval(() => Backend.refreshConfig(), 120000);
  // inside the SuperApp: notice a new or lapsed subscription now and then, and whenever the app comes back
  if (Backend.mode === 'remote' && SuperApp.available() && CONFIG.gameCenter.enabled){
    setInterval(() => refreshSubscription().catch(() => {}), 20 * 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshSubscription().catch(() => {}); });
  }
})();

/* Opened from the Game Center in the telebirr SuperApp: sign in with the SuperApp's token (no SMS code), or, when
   already signed in, check the subscription again. Returns where to go next, or null to carry on as usual. */
async function superAppSignIn(){
  if (Backend.mode !== 'remote' || !(CONFIG.gameCenter && CONFIG.gameCenter.enabled) || !SuperApp.available()) return null;
  try{
    const token = await SuperApp.getToken();
    if (P){
      try{ P.subscription = await Backend.refreshSubscription(token); return null; }
      catch(e){ if (e.status !== 409) return null; await Backend.signOut(); P = null; }   // another telebirr account: start again as that one
    }
    const r = await Backend.superappSignIn(token);
    if (r.needPhone) return { go: 'phone', data: { mode: 'new', linkToken: r.linkToken, suggestedName: r.suggestedName } };
    setPlayer(r.player);
    return { suggestedName: r.suggestedName };
  }catch(e){
    return { go: 'superappError', data: { message: e.message } };
  }
}
SCREENS.superappError = () => {
  screen(`<div class="scroll"><div class="auth">
    <div class="auth-head">${kingMark()}<h1>${t('Could not sign in with telebirr')}</h1><p>${esc(view.data.message || '')}</p></div>

    <p class="tiny center" style="margin-top:12px">${t('If this keeps happening, close King Safari and open it again from the Game Center.')}</p>
  </div></div>`);
  $('#saRetry').onclick = () => location.reload();
};

          <button class="btn sm ${on && gate === 'off' ? 'go' : ''}" id="gcGateOff">${t('Nothing (shown only)')}</button>
        </div>
        <button class="btn flat" id="gcOff">${on ? t('Turn the Game Center off (app without telebirr)') : t('Turn the Game Center on')}</button>
        <button class="btn flat" data-close>${t('Close')}</button>
      </div>`);
    const set = (status, days) => { if (!gcPrefs.enabled){ gcPrefs.enabled = true; applyGc(); }
      LocalBackend._setGc(status, days); refreshP(); closeSheet(); go('home'); };   // the gate decides where home leads
    const gateTo = g => { gcPrefs.enabled = true; gcPrefs.gate = g; applyGc(); refreshP(); gcMenu(); };
    document.getElementById('gcActive').onclick = () => set('Paid', 30);
    document.getElementById('gcTrial').onclick = () => set('Trial', 3);
    document.getElementById('gcNone').onclick = () => set('Unpaid', null);
    document.getElementById('gcTrialEnd').onclick = () => set('Trial', -1);
    document.getElementById('gcExpired').onclick = () => set('Paid', -1);
    document.getElementById('gcGateAll').onclick = () => gateTo('all');
    document.getElementById('gcGateRanked').onclick = () => gateTo('ranked');
    document.getElementById('gcGateOff').onclick = () => gateTo('off');
    document.getElementById('gcOff').onclick = () => { gcPrefs.enabled = !gcPrefs.enabled; applyGc(); refreshP(); closeSheet(); go('home'); };
  }

  /* the subscribe screen: no SuperApp in the demo, so open the pretend Game Center and check from here */
  const subscribe = SCREENS.subscribe;
  SCREENS.subscribe = () => {
    subscribe();
    if (document.getElementById('subCheck')) return;
    const host = document.querySelector('.sub-hero') && document.querySelector('.sub-hero').parentElement;
    if (!host) return;
    const old = host.querySelector('.steps + .note'); if (old) old.remove();      // "open from the Game Center" (true only outside the demo)
    const box = document.createElement('div'); box.className = 'stack'; box.style.marginTop = '18px';
    box.innerHTML = `<button class="btn go xl" id="subStore">${t('Open the telebirr Game Center (demo)')}</button>
      <button class="btn" id="subCheck">${t('I have subscribed')}</button>`;
    const anchor = host.querySelector('.steps');
    if (anchor) anchor.insertAdjacentElement('afterend', box); else host.appendChild(box);
    document.getElementById('subStore').onclick = () => { beep('tap'); gcStore(); };
    document.getElementById('subCheck').onclick = () => busy(document.getElementById('subCheck'), async () => {
      const r = await refreshSubscription();
      if (r && r.active){ beep('coin'); toast(t('Subscription active. Enjoy King Safari!')); go(view.data.next && view.data.next !== 'subscribe' ? view.data.next : 'home'); }
      else toast(t('No active subscription yet. Subscribe in the Game Center, then try again.'));
    }, t('Checking…'));
  };
  /* Play Friends: there is no server, so nobody can really scan the code. Under the QR code, a button lets a pretend
     friend ("Hanna", marked as the computer) join, so the whole flow can be shown on one phone. */
  const baseInvite = drawFriendInvite;
  drawFriendInvite = function(){
    baseInvite();
    const box = document.getElementById('fInvite');
    if (!box || !friendState.invite || document.getElementById('fDemoJoin')) return;
    box.querySelector('.friend-qr').insertAdjacentHTML('beforeend', `<div class="note" style="margin-top:12px; text-align:left"><b>${t('Demo:')}</b>
      ${t('no friend nearby to try it with? Let a pretend friend (the computer) join instead.')}</div>
      <button class="btn go" id="fDemoJoin" style="margin-top:10px">${t('Demo: a friend scans the code now')}</button>`);
    document.getElementById('fDemoJoin').onclick = () => { beep('tap'); LocalLive.simulateFriendJoin(); };
  };

  /* the "account disabled" screen as a preview: Close goes back to the demo instead of signing out */
  const disabled = SCREENS.disabled;
  SCREENS.disabled = () => {
    disabled();
    if (!view.data || !view.data.preview) return;
    const wrap = document.querySelector('.disabled-wrap');
    if (wrap) wrap.insertAdjacentHTML('afterbegin', `<div class="note" style="margin-bottom:12px"><b>${t('Preview.')}</b> ${t('This is what a player sees after the Fair Play Team bans them for cheating. Your demo account is not affected.')}</div>`);
    const btn = document.getElementById('disOk');
    if (btn){ btn.textContent = t('Back to the demo'); btn.onclick = () => go(P ? 'home' : 'welcome'); }
  };
})();

</script>
</body>
</html>
