};

/* ------------------------------------------------------------------ live ranked play
   Both implementations speak the same messages as the server's /ws socket:
     out: queue(stake) cancel() move(id, uci) resign(id) abort(id) draw(id)
     in:  queued, unqueued, matched, match, presence, error, conncheck,
          connection {online, since, attempt}, net {rtt, quality}
   checkConnection() measures the connection before ranked play: { ok, quality: good|fair|poor|offline, rtt, answered, sent }.
   The server repeats its own check when the player queues, and that one decides.                                   */
const NET = () => Rules.CONNECTION;
/* good: quick and nothing lost · fair: playable, but slower or a probe lost · poor: not stable enough for ranked */
function netQuality(rtt, answered, sent){
  const C = NET();
  if (!answered) return 'offline';
  if (answered < C.PROBES_NEEDED * sent / C.PROBES || rtt == null || rtt > C.MAX_RTT_MS) return 'poor';
  const slow = (navigator.connection && /(^|-)2g$/.test(navigator.connection.effectiveType || '')) || rtt > C.WARN_RTT_MS;
  return slow || answered < sent ? 'fair' : 'good';
}
const median = xs => { const a = xs.slice().sort((x, y) => x - y); return a.length ? a[Math.floor((a.length - 1) / 2)] : null; };
const LiveBase = {
  _handlers: new Set(),
  on(fn){ this._handlers.add(fn); return () => this._handlers.delete(fn); },
  emit(m){ this._handlers.forEach(h => { try{ h(m); }catch(e){ console.error(e); } }); }
};

/* real players, through the server */
const RemoteLive = Object.assign(Object.create(LiveBase), {
  ws: null, ready: false, retry: 0, outbox: [], closing: false, pings: new Map(), lastPong: 0, beatT: null, retryT: null,
  droppedAt: null, rtt: null, quality: null, _wired: false,
  connect(){
    if (!RemoteBackend.token || (this.ws && this.ws.readyState < 2)) return;
    this.closing = false; clearTimeout(this.retryT);
    this._wire();
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    this.ws = ws;
    ws.onopen = () => ws.send(JSON.stringify({ t: 'auth', token: RemoteBackend.token, device: deviceId() }));
    ws.onmessage = e => {
      let m; try{ m = JSON.parse(e.data); }catch(_){ return; }
      if (m.t === 'probe'){ ws.send(JSON.stringify({ t: 'probe_ack', id: m.id })); return; }      // the server's connection check
      if (m.t === 'pong'){ this._pong(m); return; }
      if (m.t === 'hello'){
        this.ready = true; this.retry = 0; this.lastPong = Date.now();
        const since = this.droppedAt; this.droppedAt = null;
        this.outbox.splice(0).forEach(x => ws.send(x));
        this._beat();
        this.emit({ t: 'connection', online: true, wasDownMs: since ? Date.now() - since : 0 }); return;
      }
      this.emit(m);
    };
    ws.onclose = e => this._closed(ws, e.code);
  },
  /* the socket is gone (closed by either side, or found silent by the heartbeat): reconnect quickly */
  _closed(ws, code){
    if (ws !== this.ws) return;
    ws.onclose = ws.onmessage = null;
    clearInterval(this.beatT); this.pings.clear();
    const was = this.ready; this.ready = false; this.ws = null;
    // 4009: this account was opened in another tab or on another device; reconnecting would fight it
    if (code === 4009){ this.closing = true; this.emit({ t: 'replaced' }); return; }
    if (code === 4030){ this.closing = true; RemoteBackend.token = null; try{ localStorage.removeItem(TOKEN_KEY); }catch(_){} accountDisabled(); return; }
    if (code === 4003){ this.closing = true; this.emit({ t: 'session_ended' }); return; }
    if (was || this.droppedAt) { if (!this.droppedAt) this.droppedAt = Date.now(); this.emit({ t: 'connection', online: false, since: this.droppedAt, attempt: this.retry }); }
    // a dropped player has a limited time to return, so retries stay frequent (at most 3 s apart)
    if (!this.closing && RemoteBackend.token) this.retryT = setTimeout(() => this.connect(), Math.min(3000, 400 * 2 ** this.retry++));
  },
  /* heartbeat: a ping every HEARTBEAT_S. No answer for a while means the connection is dead even if the browser has
     not noticed (common on mobile data): drop it and reconnect at once rather than wait for a timeout. */
  _beat(){
    clearInterval(this.beatT);
    this.beatT = setInterval(() => {
      if (!this.ws || !this.ready) return;
      if (Date.now() - this.lastPong > NET().HEARTBEAT_S * 2400){ const ws = this.ws; try{ ws.close(); }catch(_){} this._closed(ws, 1006); return; }
      this.ping().catch(() => {});
    }, NET().HEARTBEAT_S * 1000);
  },
  _pong(m){
    this.lastPong = Date.now();
    const p = this.pings.get(m.id); if (!p) return;
    this.pings.delete(m.id); clearTimeout(p.timer);
    const rtt = Date.now() - p.at; p.resolve(rtt);
    this.rtt = this.rtt == null ? rtt : Math.round(this.rtt * .7 + rtt * .3);
    this.emit({ t: 'net', rtt: this.rtt });
  },
  _wire(){                                    // come back as soon as the phone says it is online or the app is reopened
    if (this._wired) return; this._wired = true;
    addEventListener('online', () => { if (!this.ready && !this.closing){ this.retry = 0; this.connect(); } });
    addEventListener('offline', () => { if (this.ws){ const ws = this.ws; try{ ws.close(); }catch(_){} this._closed(ws, 1006); } });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || this.closing || !RemoteBackend.token) return;
      if (!this.ready){ this.retry = 0; this.connect(); } else this.ping().catch(() => {});
    });
  },
  /* one round trip to the server, in ms (rejects after PROBE_TIMEOUT_MS) */
  ping(){
    return new Promise((resolve, reject) => {
      if (!this.ws || !this.ready || this.ws.readyState !== 1) return reject(new Error('offline'));
      const id = Math.random().toString(36).slice(2, 10);
      const timer = setTimeout(() => { this.pings.delete(id); reject(new Error('timeout')); }, NET().PROBE_TIMEOUT_MS);
      this.pings.set(id, { at: Date.now(), resolve, timer });
      this.ws.send(JSON.stringify({ t: 'ping', id }));
    });
  },
  /* wait until connected (up to ms) */
  whenReady(ms){
    if (this.ready) return Promise.resolve(true);
    this.retry = 0; this.connect();
    return new Promise(resolve => {
      const t0 = Date.now(), iv = setInterval(() => {
        if (this.ready || Date.now() - t0 > ms){ clearInterval(iv); resolve(this.ready); }
      }, 100);
    });
  },
  /* the check before ranked play. onStep(i, rtt|null) is called after each probe, for the progress display. */
  async checkConnection(onStep){
    const C = NET();
    if (navigator.onLine === false) return { ok: false, quality: 'offline', rtt: null, answered: 0, sent: C.PROBES + 1 };
    if (!(await this.whenReady(6000))) return { ok: false, quality: 'offline', rtt: null, answered: 0, sent: C.PROBES + 1 };
    const n = C.PROBES + 1, rtts = [];
    for (let i = 0; i < n; i++){
      const r = await this.ping().catch(() => null);
      if (r != null) rtts.push(r);
      if (onStep) onStep(i, r);
      if (i < n - 1) await wait(250);
    }
    const rtt = median(rtts), quality = netQuality(rtt, rtts.length, n);
    this.quality = quality;
    return { ok: quality === 'good' || quality === 'fair', quality, rtt, answered: rtts.length, sent: n };
  },
  close(){ this.closing = true; this.outbox = []; clearInterval(this.beatT); clearTimeout(this.retryT); if (this.ws){ const ws = this.ws; this.ws = null; ws.onclose = null; ws.close(); } this.ready = false; this.droppedAt = null; },
  send(obj){
    const data = JSON.stringify(obj);
    if (this.ready && this.ws.readyState === 1) this.ws.send(data);
    else { if (obj.t !== 'queue') this.outbox.push(data); else this.outbox = this.outbox.filter(x => !x.includes('"t":"queue"')).concat(data); this.connect(); }
  },
  queue(stake, game){ this.send({ t: 'queue', stake, game }); },
  cancel(){ this.send({ t: 'cancel' }); },
  move(id, uci){ this.send({ t: 'move', matchId: id, uci }); },
  resign(id){ this.send({ t: 'resign', matchId: id }); },
  abort(id){ this.send({ t: 'abort', matchId: id }); },
  draw(id){ this.send({ t: 'draw', matchId: id }); },
  away(id){ if (this.ready) this.send({ t: 'away', matchId: id }); },
  signal(id, kind){ this.send({ t: 'signal', matchId: id, kind }); },     // app-integrity signal during a ranked match
  reconnect(){ this.closing = false; this.retry = 0; this.connect(); },
  // Play Friends (junior accounts only; the server checks)
  friendInvite(game, color){ this.send({ t: 'friend_invite', game, color }); },
  friendCancel(){ this.send({ t: 'friend_cancel' }); },
  friendPeek(code){ this.send({ t: 'friend_peek', code }); },
  friendJoin(code){ this.send({ t: 'friend_join', code }); },
  friendMove(id, uci){ this.send({ t: 'friend_move', gameId: id, uci }); },
  friendResign(id){ this.send({ t: 'friend_resign', gameId: id }); },
  friendDraw(id){ this.send({ t: 'friend_draw', gameId: id }); },
  friendRematch(id){ this.send({ t: 'friend_rematch', gameId: id }); },
  friendLeave(){ this.send({ t: 'friend_leave' }); },
  friendSync(){ this.send({ t: 'friend_sync' }); },
  sync(){ this.send({ t: 'sync' }); },
  online(){ return this.ready; },                       // ask for the current position (after opening the board, or reconnecting)
  active(){ return RemoteBackend.rankedActive(); }
});

/* demo only: no server, so the opponent is the computer and the app says so */
const LocalLive = Object.assign(Object.create(LiveBase), {
  qTimer: null, tickT: null, simNet: 'good', offline: false, oppGone: null,
  connect(){}, close(){ clearTimeout(this.qTimer); },
  online(){ return !this.offline; },
  /* the demo has no server: the check is simulated (Demo tools can make it weak, to show what a player sees) */
  async checkConnection(onStep){
    const C = NET(), n = C.PROBES + 1, rtts = [];
    for (let i = 0; i < n; i++){
      await wait(260);
      const r = this.simNet === 'poor' ? (i % 2 ? null : 1700 + Math.round(Math.random() * 900))
              : this.simNet === 'fair' ? 650 + Math.round(Math.random() * 300) : 45 + Math.round(Math.random() * 70);
      if (r != null) rtts.push(r);
      if (onStep) onStep(i, r);
    }
    const rtt = median(rtts), quality = netQuality(rtt, rtts.length, n);
    return { ok: quality === 'good' || quality === 'fair', quality, rtt, answered: rtts.length, sent: n };
  },
  /* demo: the practice opponent loses its connection. back=true: it returns after a few seconds; otherwise it does
     not return and forfeits when the (shortened) reconnection time runs out */
  simulateOpponentDrop(back){
    const a = LocalBackend._me(), m = a && a.active; if (!m || m.status !== 'active') return false;
    const graceMs = back ? NET().GRACE_S * 1000 : 12000, until = Date.now() + graceMs;
    clearTimeout(this.oppGone && this.oppGone.timer);
    this.oppGone = { until, timer: setTimeout(() => {
      this.oppGone = null;
      const a = LocalBackend._me(), m = a && a.active; if (!m || m.status !== 'active') return;
      if (back){ this.emit({ t: 'presence', matchId: m.id, online: true, back: true, serverNow: Date.now() }); return; }
      if (m.moves.length < 2){ this._settle(a, m, 'aborted', 'a player did not move in time'); return this._push(a, m); }
      this._charge(m); this._settle(a, m, 'won', 'a lost connection that was not restored in time'); this._push(a, m);
    }, back ? 7000 : graceMs) };
    this.emit({ t: 'presence', matchId: m.id, online: false, graceUntil: until, serverNow: Date.now() });
    return true;
  },
  /* demo: this device loses its connection for a few seconds, then reconnects */
  simulateOwnDrop(){
    if (this.offline) return;
    const since = Date.now(); this.offline = true;
    this.emit({ t: 'connection', online: false, since, attempt: 0 });
    setTimeout(() => { this.offline = false; this.emit({ t: 'connection', online: true, wasDownMs: Date.now() - since }); this.sync(); }, 6000);
  },
  _view(a, m){
    const s = GAMES[m.game || 'chess'].replay(m.moves);
    const first = m.status === 'active' && m.moves.length < 2 ? m.turnStartedAt + 30000 : null;
    return { id: m.id, game: m.game || 'chess', status: m.status, my: m.my, stake: m.stake, pot: m.pot, opp: m.opp, moves: m.moves.slice(),
      turn: GAMES[m.game || 'chess'].turnOf(s),
      clock: { w: m.clock.w, b: m.clock.b, turnStartedAt: m.turnStartedAt, serverNow: Date.now() }, firstMoveBy: first,
      drawOffer: m.drawOffer || null, endReason: m.endReason || null, ratingDelta: m.ratingDelta, xp: m.xp, oppOnline: !this.oppGone, oppGraceUntil: this.oppGone ? this.oppGone.until : null,
      payout: m.status === 'won' ? m.pot : (m.status === 'drawn' || m.status === 'aborted') ? m.stake : 0 };
  },
  _push(a, m){
    if (m.peer && m.status !== 'active' && this._session && this._session.id === m.id){ this._session.end(); this._session = null; clearTimeout(this._graceT); this.offline = false; this.oppGone = null; }
    LocalBackend._save(a);
    this.emit({ t: 'match', match: this._view(a, m), player: m.status !== 'active' ? LocalBackend._pub(a) : undefined });
  },
  _charge(m){ const G = GAMES[m.game || 'chess'], turn = G.turnOf(G.replay(m.moves)), now = Date.now();
    m.clock[turn] = Math.max(0, m.clock[turn] - (now - m.turnStartedAt)); m.turnStartedAt = now; return turn; },
  _settle(a, m, result, reason){
    clearInterval(this.tickT);
    const mine = LocalBackend._stats(a, m.game || 'chess');
    const back = (label, cash, bonus) => {
      if (cash) LocalBackend._ledger(a, cash, label, 'vs ' + m.opp.name);
      if (bonus) LocalBackend._bonus(a, bonus, label, 'vs ' + m.opp.name, 'payout');
    };
    const mb = m.myBonus || 0;
    if (result === 'aborted'){ back('Match canceled — stake returned', m.stake - mb, mb); }
    else {
      const score = result === 'won' ? 1 : result === 'drawn' ? .5 : 0, delta = Rules.elo(mine.rating, m.opp.rating, score);
      if (result === 'won') back('Won the pool', m.pot - mb, mb);          // the computer opponent stakes cash
      if (result === 'drawn') back('Draw — stake returned', m.stake - mb, mb);
      mine.rating = Math.max(400, mine.rating + delta); m.ratingDelta = delta;
      if (result === 'won') mine.w++; else if (result === 'drawn') mine.d++; else mine.l++;
      m.xp = Rules.rankedXP(result === 'won' ? 'W' : result === 'drawn' ? 'D' : 'L', reason);
      Rules.addXP(a, m.xp);
      a.matches.unshift({ game: m.game || 'chess', opp: m.opp.name, avatar: m.opp.avatar, result: {won:'W', lost:'L', drawn:'D'}[result], stake: m.stake, delta });
      a.matches = a.matches.slice(0, 25);
    }
    Object.assign(m, { status: result, endReason: reason }); a.active = null;
  },
  _ended(a, m, s){
    const G = GAMES[m.game || 'chess'], st = G.status(s); if (!st.over) return false;
    const reason = { mate:'checkmate', stalemate:'stalemate', fifty:'50-move rule', material:'insufficient material',
      blocked:'no moves left', quiet:'40-move rule' }[st.type] || st.type;
    this._settle(a, m, st.winner ? (st.winner === m.my ? 'won' : 'lost') : 'drawn', reason); return true;
  },
  _tick(){                                                   // first-move window and flag fall
    clearInterval(this.tickT);
    this.tickT = setInterval(() => {
      const a = LocalBackend._me(), m = a && a.active; if (!m || m.status !== 'active') return clearInterval(this.tickT);
      const G = GAMES[m.game || 'chess'], turn = G.turnOf(G.replay(m.moves)), left = m.clock[turn] - (Date.now() - m.turnStartedAt);
      if (m.moves.length < 2 && Date.now() > m.turnStartedAt + 30000){
        if (m.peer) this._psend({ t: 'abort' });
        this._settle(a, m, 'aborted', 'a player did not move in time'); return this._push(a, m);
      }
      if (left <= 0){
        if (m.peer){
          if (turn !== m.my){ if (left > -3000) return; this._psend({ t: 'timeout' }); }   // a moment's grace for a move on its way
          else this._psend({ t: 'flag' });
        }
        this._charge(m); this._settle(a, m, turn === m.my ? 'lost' : 'won', 'time'); this._push(a, m);
      }
    }, 500);
  },
  _reply(){
    setTimeout(() => {
      const a = LocalBackend._me(), m = a && a.active;
      if (!m || m.status !== 'active' || m.peer) return;
      const G = GAMES[m.game || 'chess'], s = G.replay(m.moves); if (G.turnOf(s) === m.my) return;
      if (this.oppGone) return this._reply();                    // a disconnected opponent cannot move
      const mv = G.botMove(s, m.level);
      this._charge(m); m.moves.push(G.toUci(mv));
      this._ended(a, m, G.apply(s, mv)); this._push(a, m);
    }, 700 + Math.random() * 1500);
  },
  /* the stake leaves the wallet when the match opens: bonus tokens first */
  _stakeIt(a, m){
    m.myBonus = Math.min(a.bonus || 0, m.stake);
    if (m.myBonus) LocalBackend._bonus(a, -m.myBonus, 'Staked in a ranked match', 'vs ' + m.opp.name, 'stake');
    if (m.stake - m.myBonus) LocalBackend._ledger(a, -(m.stake - m.myBonus), 'Staked in a ranked match', 'vs ' + m.opp.name);
  },
  /* the practice opponent (the computer), clearly marked as such */
  _computerSoon(stake, game, ms){
    clearTimeout(this.qTimer);
    this.qTimer = setTimeout(() => {
      const a = LocalBackend._me(); if (!a || (a.active && a.active.status === 'active')) return;
      const mine = LocalBackend._stats(a, game);
      const rating = Math.max(500, mine.rating + Math.round((Math.random() - .5) * 160));
      const m = { id: 'local-' + Date.now(), game, status: 'active', my: Math.random() < .5 ? 'w' : 'b', stake, pot: stake * 2,
        opp: { name: 'Practice opponent', avatar: '🤖', rating, computer: true }, level: Rules.levelForRating(rating),
        moves: [], clock: { w: Rules.CLOCK_MS, b: Rules.CLOCK_MS }, turnStartedAt: Date.now() };
      this._stakeIt(a, m);
      a.active = m; LocalBackend._save(a); this._qStake = null;
      this.emit({ t: 'matched', match: this._view(a, m) });

    }, ms == null ? 1800 + Math.random() * 2200 : ms);
  },
  _stopSearch(){ this._qToken = null; clearTimeout(this.qTimer); if (this._search){ try{ this._search.cancel(); }catch(e){} this._search = null; } },
  queue(stake, game){
    game = game || 'chess';
    try{
      const a = LocalBackend._need(), mine = LocalBackend._stats(a, game);
      if (!Rules.STAKES.includes(stake)) throw err('Pick one of the stake tables.');
      if (a.tokens + (a.bonus || 0) < stake) throw err('Not enough tokens for that table.', 402);
      if (a.excludedUntil && new Date(a.excludedUntil) > new Date()) throw err('You are on a break from buying tokens and ranked play.', 403);
      if (!Rules.stakeUnlocked(stake, mine.w + mine.l + mine.d)) throw err(`The ${stake}-token table opens after ${Rules.STAKE_UNLOCK_GAMES} ranked games.`, 403);
      if (a.active && a.active.status === 'active') throw err('You already have a ranked match in progress.', 409);
      LocalBackend._guard(a, 'ranked');
      LocalBackend._access(a, 'ranked');
      this._stopSearch();
      this.emit({ t: 'conncheck', ok: true, quality: 'good', rtt: 60 + Math.round(Math.random() * 60), answered: 4, sent: 4 });
      this._qStake = { stake, game };
      const token = this._qToken = {};
      const me = { name: a.name, avatar: a.avatar, rating: mine.rating };
      // real players first: look for someone at this table online, for as long as the player keeps the search open
      P2P.load().then(ok => {
        if (this._qToken !== token) return;
        if (!ok){ this.emit({ t: 'queued', stake, rating: mine.rating, online: false }); return this._computerSoon(stake, game); }
        this.emit({ t: 'queued', stake, rating: mine.rating, online: true });
        const h = this._search = P2P.findMatch({ game, stake, me, maxGap: Rules.MATCH.MAX_GAP });
        h.done.then(res => {
          if (this._search !== h){ if (res) try{ res.conn.close(); }catch(e){} return; }
          this._search = null;
          if (res) this._startPeer(res, stake, game);
        }).catch(() => {
          if (this._search !== h) return;
          this._search = null;
          this.emit({ t: 'queued', stake, rating: mine.rating, online: false, failed: true });
          this._computerSoon(stake, game);
        });
      });
    }catch(e){ this.emit({ t: 'unqueued', error: e.message, code: e.code }); }
  },
  /* the player chose the practice opponent instead of waiting for a person */
  playComputer(){ const q = this._qStake; if (!q) return; this._stopSearch(); this._computerSoon(q.stake, q.game, 300); },
  cancel(){ this._stopSearch(); this._qStake = null; this.emit({ t: 'unqueued' }); },

  /* ---------- a ranked match against a real person, phone to phone ---------- */
  /* what an opponent says about themselves is shown on screen, so it is checked like a name typed here */
  _cleanOpp(o){
    let name = String((o && o.name) || '').replace(/[<>&"'`\u0000-\u001f]/g, '').trim().slice(0, 14);
    if (name.length < 2 || (typeof Moderation !== 'undefined' && Moderation.check(name, 'name'))) name = 'Player';
    const avatar = Rules.AVATARS.includes(o && o.avatar) ? o.avatar : '🦁';
    const rating = Math.max(100, Math.min(3000, Math.round(+(o && o.rating) || 1000)));
    return { name, avatar, rating };
  },
  _psend(x){ const s = this._session; return !!(s && s.send && s.send(x)); },
  _sessionFor(m){
    return P2P.session({ id: m.id, oppPeerId: m.oppPeerId, conn: m._conn || null, extra: m._extra || [],
      onMsg: x => this._peerMsg(x), onDown: () => this._peerDown(), onUp: () => this._peerUp() });
  },
  _startPeer(res, stake, game){
    const a = LocalBackend._me();
    if (!a || (a.active && a.active.status === 'active')){ try{ res.conn.close(); }catch(e){} return; }
    const opp = this._cleanOpp(res.opp);
    const m = { id: String(res.id).slice(0, 40), game, status: 'active', my: res.my, stake, pot: stake * 2, opp: { ...opp, computer: false },
      peer: true, myPeerId: P2P.myId(), oppPeerId: String(res.oppPeerId || '').slice(0, 80),
      moves: [], clock: { w: Rules.CLOCK_MS, b: Rules.CLOCK_MS }, turnStartedAt: Date.now() };
    this._stakeIt(a, m);
    a.active = m; LocalBackend._save(a); this._qStake = null;
    this._session = P2P.session({ id: m.id, oppPeerId: m.oppPeerId, conn: res.conn, extra: res.extra,
      onMsg: x => this._peerMsg(x), onDown: () => this._peerDown(), onUp: () => this._peerUp() });
    this.offline = false; this.oppGone = null;
    this.emit({ t: 'matched', match: this._view(a, m) });
    this._tick();
  },
  /* back after a reload: the same peer address if it can be had, then dial the opponent; the reconnection time runs meanwhile */
  _resumePeer(a, m){
    if (this._resuming === m.id) return;
    this._resuming = m.id;
    this._peerDown(true);
    P2P.me(m.myPeerId).then(() => {
      const a2 = LocalBackend._me(), m2 = a2 && a2.active;
      if (!m2 || m2.id !== m.id || m2.status !== 'active') return;
      this._session = P2P.session({ id: m.id, oppPeerId: m.oppPeerId, conn: null,
        onMsg: x => this._peerMsg(x), onDown: () => this._peerDown(), onUp: () => this._peerUp() });
    }).catch(() => {}).finally(() => { this._resuming = null; });
  },
  _peerMsg(x){
    const a = LocalBackend._me(), m = a && a.active;
    if (!m || !m.peer || m.status !== 'active' || !x) return;
    const Gm = GAMES[m.game || 'chess'], s = Gm.replay(m.moves), opp = m.my === 'w' ? 'b' : 'w';
    switch (x.t){
      case 'move': {
        if (x.ply !== m.moves.length || Gm.turnOf(s) !== opp){ this._psend({ t: 'state', moves: m.moves, clock: m.clock }); return; }
        const mv = Gm.fromUci(s, String(x.uci || '')); if (!mv) return;
        const before = m.clock[opp];
        this._charge(m);
        if (Number.isFinite(+x.left)) m.clock[opp] = Math.max(0, Math.min(before, +x.left));
        m.moves.push(Gm.toUci(mv)); m.drawOffer = null;
        this._ended(a, m, Gm.apply(s, mv)); return this._push(a, m);
      }
      case 'resign': this._charge(m); this._settle(a, m, 'won', 'resignation'); return this._push(a, m);
      case 'abort': if (m.moves.length < 2){ this._settle(a, m, 'aborted', 'canceled before the first move'); this._push(a, m); } return;
      case 'draw_offer': m.drawOffer = 'opp'; return this._push(a, m);
      case 'draw_accept': if (m.drawOffer === 'me'){ this._settle(a, m, 'drawn', 'agreement'); this._push(a, m); } return;
      case 'flag': this._charge(m); this._settle(a, m, 'won', 'time'); return this._push(a, m);
      case 'timeout': {
        const mineLeft = m.clock[m.my] - (Gm.turnOf(s) === m.my ? Date.now() - m.turnStartedAt : 0);
        if (mineLeft <= 2500){ this._charge(m); this._settle(a, m, 'lost', 'time'); this._push(a, m); }
        return;
      }
      case 'gone': {                                         // the opponent's own phone says it did not get back in time
        const early = m.moves.length < 2;
        this._settle(a, m, early ? 'aborted' : 'won', early ? 'a player did not move in time' : 'a lost connection that was not restored in time');
        return this._push(a, m);
      }
      case 'state': {
        const theirs = Array.isArray(x.moves) ? x.moves.slice(0, 600).map(String) : [];
        if (theirs.length > m.moves.length && m.moves.every((u, k) => u === theirs[k]) && Gm.replay(theirs)){
          m.moves = theirs; m.turnStartedAt = Date.now(); m.drawOffer = null;
          if (x.clock) ['w', 'b'].forEach(c => { if (Number.isFinite(+x.clock[c])) m.clock[c] = Math.max(0, Math.min(m.clock[c], +x.clock[c])); });
          this._ended(a, m, Gm.replay(m.moves));
        }
        return this._push(a, m);
      }
    }
  },
  /* the connection between the two phones dropped. If this phone is offline it is ours; otherwise the opponent's. */
  _peerDown(ours){
    const a = LocalBackend._me(), m = a && a.active;
    if (!m || !m.peer || m.status !== 'active') return;
    const mine = ours || navigator.onLine === false || P2P.signallingDown();
    const grace = NET().GRACE_S * 1000, until = Date.now() + grace;
    clearTimeout(this._graceT);
    if (mine){ this.offline = true; this.emit({ t: 'connection', online: false, since: Date.now(), attempt: 0 }); }
    else { this.oppGone = { until }; this.emit({ t: 'presence', matchId: m.id, online: false, graceUntil: until, serverNow: Date.now() }); }
    this._graceT = setTimeout(() => {
      const a2 = LocalBackend._me(), m2 = a2 && a2.active;
      if (!m2 || m2.id !== m.id || m2.status !== 'active') return;
      if (this._session && this._session.lk && this._session.lk.alive) return;
      const early = m2.moves.length < 2;
      this._charge(m2);
      this._settle(a2, m2, early ? 'aborted' : mine ? 'lost' : 'won', early ? 'a player did not move in time' : 'a lost connection that was not restored in time');
      this.offline = false; this.oppGone = null;
      this._push(a2, m2);
    }, grace);
  },
  _peerUp(){
    const a = LocalBackend._me(), m = a && a.active;
    clearTimeout(this._graceT);
    const wasOff = this.offline, wasGone = !!this.oppGone;
    this.offline = false; this.oppGone = null;
    if (!m || !m.peer || m.status !== 'active') return;
    if (wasOff) this.emit({ t: 'connection', online: true });
    if (wasGone) this.emit({ t: 'presence', matchId: m.id, online: true, back: true, serverNow: Date.now() });
    this._psend({ t: 'state', moves: m.moves, clock: m.clock });
    this._push(a, m);
  },
  _act(id, fn){
    if (this.offline) return this.emit({ t: 'error', error: 'You are offline. Your move will be sent when the connection is back.' });
    const a = LocalBackend._me(), m = a && a.active;
    if (!m || m.id !== id || m.status !== 'active') return this.emit({ t: 'error', error: 'This match is already over.' });
    try{ fn(a, m); }catch(e){ return this.emit({ t: 'error', error: e.message, match: this._view(a, m) }); }
    this._push(a, m);
  },
  move(id, uci){ this._act(id, (a, m) => {
    const G = GAMES[m.game || 'chess'], s = G.replay(m.moves);
    if (G.turnOf(s) !== m.my) throw err('It is not your turn.');
    const mv = G.fromUci(s, uci); if (!mv) throw err('That move is not legal.');
    this._charge(m); m.moves.push(G.toUci(mv)); m.drawOffer = null;
    if (m.peer) this._psend({ t: 'move', ply: m.moves.length - 1, uci: G.toUci(mv), left: m.clock[m.my] });
    if (!this._ended(a, m, G.apply(s, mv)) && !m.peer) this._reply();
  }); },
  resign(id){ this._act(id, (a, m) => { if (m.peer) this._psend({ t: 'resign' }); this._charge(m); this._settle(a, m, 'lost', 'resignation'); }); },
  abort(id){ this._act(id, (a, m) => {
    if (m.moves.some((_, i) => (i % 2 ? 'b' : 'w') === m.my)) throw err('You have already moved. Leaving now means resigning.');
    if (m.peer) this._psend({ t: 'abort' });
    this._settle(a, m, 'aborted', 'canceled before the first move');
  }); },
  draw(id){
    const a = LocalBackend._me(), m = a && a.active;
    if (!m || !m.peer) return this.emit({ t: 'error', error: 'The practice opponent declined the draw.' });
    this._act(id, (a, m) => {
      if (m.drawOffer === 'opp'){ this._psend({ t: 'draw_accept' }); this._settle(a, m, 'drawn', 'agreement'); }
      else { m.drawOffer = 'me'; this._psend({ t: 'draw_offer' }); }
    });
  },
  away(){}, signal(){}, reconnect(){},

  /* ---------- Play Friends ----------
     Online through PeerJS: the host's code is the meeting point, and the game is played phone to phone. Junior accounts
     play only junior accounts and adult accounts only adult accounts (both phones check). Where PeerJS cannot load
     (no internet), the demo falls back to a pretend friend ("Hanna", marked as the computer). */
  fr: { invite: null, game: null, session: null, hosting: null, pending: null },
  FRIEND: { name: 'Hanna', avatar: '🦒', computer: true },
  FRIEND_GRACE_MS: 10 * 60 * 1000,
  _fCheck(){
    const a = LocalBackend._need();
    LocalBackend._ready(a); LocalBackend._access(a, 'play');
    return a;
  },
  _fKind(){ const a = LocalBackend._me(); return { junior: !!(a && LocalBackend._junior(a).junior), name: a ? a.name : 'Player', avatar: a ? a.avatar : '🦁' }; },
  _fTry(fn){ try{ fn(); }catch(e){ this.emit({ t: 'error', error: e.message }); } },
  _fView(){ const g = this.fr.game; return g && { ...g, moves: g.moves.slice(), opp: { ...g.opp } }; },
  _fPush(type){ this.emit({ t: type || 'friend', match: this._fView() }); },
  _kindError(){ return t('Junior accounts can only play with junior accounts, and adult accounts with adult accounts.'); },
  friendInvite(game, color){ this._fTry(() => {
    this._fCheck();
    if (this.fr.hosting){ this.fr.hosting.stop(); this.fr.hosting = null; }
    const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', code = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => A[b % A.length]).join('');
    // a demo hosted on a website gets a real link to itself; opened from a file there is no address, so the code alone
    const url = /^https?:/.test(location.protocol) ? location.origin + location.pathname + '?friend=' + code : code;
    const inv = this.fr.invite = { code, game: game || 'chess', color: color || 'random', expiresAt: Date.now() + 30 * 6e4, url, online: null };
    this.emit({ t: 'friend_invite', invite: inv });
    P2P.load().then(ok => !ok ? null : P2P.hostFriend(code, {
      onPeek: () => { const k = this._fKind(); return { game: inv.game, host: { name: k.name, avatar: k.avatar }, junior: k.junior }; },
      onJoin: m => {
        const k = this._fKind();
        if (this.fr.invite !== inv || Date.now() > inv.expiresAt) return { refuse: 'expired' };
        if (!!m.junior !== k.junior) return { refuse: 'kind' };
        if (this.fr.game && this.fr.game.status === 'active') return { refuse: 'busy' };
        const mine = inv.color === 'random' ? (Math.random() < .5 ? 'w' : 'b') : inv.color;
        return { start: { id: 'pf-' + code + '-' + Date.now().toString(36), game: inv.game, color: mine === 'w' ? 'b' : 'w', name: k.name, avatar: k.avatar }, mine };
      },
      onStart: (conn, r, m, lobby) => {
        this.fr.invite = null; this.fr.hosting = null;
        this._fStartPeer({ conn, id: r.start.id, game: r.start.game, my: r.mine, opp: m, oppPeerId: m.peer, extra: [lobby] });
      }
    })).then(h => {
      if (this.fr.invite === inv){ inv.online = !!h; this.fr.hosting = h; this.emit({ t: 'friend_invite', invite: inv }); }
      else if (h) h.stop();
    }).catch(() => { if (this.fr.invite === inv){ inv.online = false; this.emit({ t: 'friend_invite', invite: inv }); } });
  }); },
  friendCancel(){ if (this.fr.hosting){ this.fr.hosting.stop(); this.fr.hosting = null; } this.fr.invite = null; this.emit({ t: 'friend_invite', invite: null }); },
  friendPeek(code){ this._fTry(() => {
    this._fCheck();
    const c = String(code || '').toUpperCase();
    if (!/^[A-HJ-NP-Z2-9]{6}$/.test(c)) throw err('That code did not work. Check it with your friend, or ask for a new one.', 404);
    if (this.fr.invite && this.fr.invite.code === c) throw err('That is your own code. Send it to your friend.');
    P2P.load().then(async ok => {
      if (!ok) return this._fPeekDemo(c);
      const k = this._fKind();
      try{
        const r = await P2P.peekFriend(c, { junior: k.junior });
        if (!!r.invite.junior !== k.junior){ try{ r.conn.close(); }catch(e){} return this.emit({ t: 'error', about: 'friend_peek', error: this._kindError() }); }
        if (this.fr.pending) try{ this.fr.pending.conn.close(); }catch(e){}
        this.fr.pending = { code: c, conn: r.conn };
        const host = this._cleanOpp(r.invite.host || {});
        this.emit({ t: 'friend_peek', invite: { code: c, game: Rules.GAMES_PLAYABLE.includes(r.invite.game) ? r.invite.game : 'chess', host: { name: host.name, avatar: host.avatar } } });
      }catch(e){
        if (e && e.type === 'unavailable') return this._fPeekDemo(c);
        this.emit({ t: 'error', about: 'friend_peek', error: t('Nobody is waiting with that code. Check it with your friend, or ask them for a new one.') });
      }
    });
  }); },
  /* no internet for online play: the demo's pretend friend answers any code */
  _fPeekDemo(c){ this.emit({ t: 'friend_peek', invite: { code: c, game: gameId0(), host: { name: this.FRIEND.name, avatar: this.FRIEND.avatar }, demo: true } }); },
  friendJoin(code){ this._fTry(() => {
    this._fCheck();
    const pend = this.fr.pending;
    if (!pend || pend.code !== String(code || '').toUpperCase()) return this._fStart(gameId0(), Math.random() < .5 ? 'w' : 'b');
    this.fr.pending = null;
    const k = this._fKind();
    P2P.joinFriend(pend.conn, { name: k.name, avatar: k.avatar, junior: k.junior }).then(st => {
      this._fStartPeer({ conn: pend.conn, id: String(st.id).slice(0, 60), game: Rules.GAMES_PLAYABLE.includes(st.game) ? st.game : 'chess',
        my: st.color === 'b' ? 'b' : 'w', opp: st, oppPeerId: String(st.peer || ''), extra: [] });
    }).catch(e => this.emit({ t: 'error', about: 'friend_join', error: e && e.type === 'kind' ? this._kindError()
      : e && e.type === 'busy' ? t('Your friend is already in a game.') : t('That code did not work. Check it with your friend, or ask for a new one.') }));
  }); },
  /* demo: the pretend friend scans the QR code */
  simulateFriendJoin(){
    const inv = this.fr.invite; if (!inv) return false;
    if (this.fr.hosting){ this.fr.hosting.stop(); this.fr.hosting = null; }
    this.fr.invite = null;
    this._fStart(inv.game, inv.color === 'random' ? (Math.random() < .5 ? 'w' : 'b') : inv.color);
    return true;
  },
  _fStart(game, my){
    this.fr.game = { id: 'friend-' + Date.now(), game, status: 'active', my, moves: [], turn: 'w', opp: { ...this.FRIEND }, oppOnline: true,
      endReason: null, drawOffer: null, rematch: null, xp: 0 };
    this._fPush('friend_start');
    if (my === 'b') this._fReply();
  },
  _fStartPeer(o){
    if (this.fr.session){ this.fr.session.end({ t: 'bye' }); this.fr.session = null; }
    const opp = this._cleanOpp(o.opp);
    this.fr.game = { id: o.id, game: o.game, status: 'active', my: o.my, moves: [], turn: 'w', opp: { name: opp.name, avatar: opp.avatar, computer: false },
      oppOnline: true, endReason: null, drawOffer: null, rematch: null, xp: 0, peer: true };
    this.fr.session = P2P.session({ id: o.id, oppPeerId: o.oppPeerId, conn: o.conn, extra: o.extra,
      onMsg: x => this._fPeerMsg(x), onDown: () => this._fPeerDown(), onUp: () => this._fPeerUp() });
    this._fPush('friend_start');
  },
  _fSend(x){ const s = this.fr.session; return !!(s && s.send(x)); },
  _fEnd(status, reason){
    const g = this.fr.game; Object.assign(g, { status, endReason: reason, drawOffer: null });
    clearTimeout(this._fGraceT);
    if (g.counted) return this._fPush();                          // a result is counted once, however it arrives
    g.counted = true;
    const a = LocalBackend._me(); if (!a) return this._fPush();
    const res = status === 'won' ? 'W' : status === 'drawn' ? 'D' : 'L';
    // friendly games: +5 XP for a win, nothing for a loss or a draw, -5 for resigning or a connection that did not come back
    const xp = status === 'abandoned' ? 0 : Rules.gameXP(res, reason);
    Rules.addXP(a, xp); g.xp = xp;
    if (status !== 'abandoned'){ const st = LocalBackend._stats(a, g.game); st.fg = (st.fg || 0) + 1; if (res === 'W') st.fw = (st.fw || 0) + 1; }
    LocalBackend._save(a);
    this.emit({ t: 'friend', match: this._fView(), player: LocalBackend._pub(a) });
  },
  _fState(){ const g = this.fr.game, Game = GAMES[g.game], s = Game.replay(g.moves); g.turn = Game.turnOf(s); return { Game, s }; },
  _fReply(){
    const g0 = this.fr.game;
    setTimeout(() => {
      const g = this.fr.game; if (g !== g0 || g.status !== 'active' || g.peer) return;
      const { Game, s } = this._fState(); if (Game.turnOf(s) === g.my) return;
      const mv = Game.botMove(s, 2); if (!mv) return;
      g.moves.push(Game.toUci(mv)); if (g.drawOffer === 'me') g.drawOffer = null;
      const st = Game.status(Game.apply(s, mv)); this._fState();
      if (st.over) return this._fEnd(st.winner ? (st.winner === g.my ? 'won' : 'lost') : 'drawn', st.type);
      this._fPush();
    }, 900 + Math.random() * 1600);
  },
  _fPeerMsg(x){
    const g = this.fr.game; if (!g || !g.peer || !x) return;
    if (x.t === 'bye'){ g.oppOnline = false; g.oppLeft = true; this._fPush(); return; }
    if (x.t === 'rematch'){
      if (g.status === 'active') return;
      if (g.rematch === 'me') return this._fRematchGo();
      g.rematch = 'opp'; return this._fPush();
    }
    if (g.status !== 'active') return;
    const { Game, s } = this._fState(), opp = g.my === 'w' ? 'b' : 'w';
    switch (x.t){
      case 'move': {
        if (x.ply !== g.moves.length || Game.turnOf(s) !== opp){ this._fSend({ t: 'state', moves: g.moves }); return; }
        const mv = Game.fromUci(s, String(x.uci || '')); if (!mv) return;
        g.moves.push(Game.toUci(mv)); if (g.drawOffer === 'me') g.drawOffer = null;
        const st = Game.status(Game.apply(s, mv)); this._fState();
        if (st.over) return this._fEnd(st.winner ? (st.winner === g.my ? 'won' : 'lost') : 'drawn', st.type);
        return this._fPush();
      }
      case 'resign': return this._fEnd('won', 'resign');
      case 'draw_offer': g.drawOffer = 'opp'; return this._fPush();
      case 'draw_accept': if (g.drawOffer === 'me') this._fEnd('drawn', 'agreed'); return;
      case 'gone': return this._fEnd('won', 'disconnect');
      case 'state': {
        const theirs = Array.isArray(x.moves) ? x.moves.slice(0, 600).map(String) : [];
        if (theirs.length > g.moves.length && g.moves.every((u, k) => u === theirs[k]) && Game.replay(theirs)){
          g.moves = theirs; const st = Game.status(Game.replay(theirs)); this._fState();
          if (st.over) return this._fEnd(st.winner ? (st.winner === g.my ? 'won' : 'lost') : 'drawn', st.type);
        }
        return this._fPush();
      }
    }
  },
  _fRematchGo(){
    const g = this.fr.game; if (!g) return;
    this.fr.game = { id: g.id.slice(0, 50) + 'r', game: g.game, status: 'active', my: g.my === 'w' ? 'b' : 'w', moves: [], turn: 'w', opp: { ...g.opp },
      oppOnline: true, endReason: null, drawOffer: null, rematch: null, xp: 0, peer: true };
    this._fPush('friend_start');
  },
  _fPeerDown(){
    const g = this.fr.game; if (!g || !g.peer || g.status !== 'active') return;
    const mine = navigator.onLine === false || P2P.signallingDown();
    if (mine){ this._fOffline = true; this.emit({ t: 'connection', online: false, since: Date.now() }); }
    else { g.oppOnline = false; this.emit({ t: 'friend_presence', gameId: g.id, online: false }); }
    clearTimeout(this._fGraceT);
    this._fGraceT = setTimeout(() => {
      const g2 = this.fr.game; if (g2 !== g || g.status !== 'active') return;
      if (this.fr.session && this.fr.session.lk && this.fr.session.lk.alive) return;
      this._fOffline = false;
      this._fEnd(mine ? 'lost' : 'won', 'disconnect');
    }, this.FRIEND_GRACE_MS);
  },
  _fPeerUp(){
    clearTimeout(this._fGraceT);
    const g = this.fr.game; if (!g || !g.peer) return;
    if (this._fOffline){ this._fOffline = false; this.emit({ t: 'connection', online: true }); }
    if (g.status === 'active' && g.oppOnline === false){ g.oppOnline = true; this.emit({ t: 'friend_presence', gameId: g.id, online: true }); }
    this._fSend({ t: 'state', moves: g.moves });
    this._fPush();
  },
  friendMove(id, uci){ this._fTry(() => {
    const g = this.fr.game; if (!g || g.id !== id) throw err('This game has ended.', 404);
    if (g.status !== 'active') throw err('This game is already over.', 409);
    const { Game, s } = this._fState();
    if (Game.turnOf(s) !== g.my) throw err('It is not your turn.', 409);
    const mv = Game.fromUci(s, uci); if (!mv) throw err('That move is not legal.');
    g.moves.push(Game.toUci(mv)); if (g.drawOffer === 'opp') g.drawOffer = null;
    if (g.peer) this._fSend({ t: 'move', ply: g.moves.length - 1, uci: Game.toUci(mv) });
    const st = Game.status(Game.apply(s, mv)); this._fState();
    if (st.over) return this._fEnd(st.winner ? (st.winner === g.my ? 'won' : 'lost') : 'drawn', st.type);
    this._fPush(); if (!g.peer) this._fReply();
  }); },
  friendResign(id){ const g = this.fr.game; if (g && g.id === id && g.status === 'active'){ if (g.peer) this._fSend({ t: 'resign' }); this._fEnd('lost', 'resign'); } },
  friendDraw(id){
    const g = this.fr.game; if (!g || g.id !== id || g.status !== 'active') return;
    if (g.peer){
      if (g.drawOffer === 'opp'){ this._fSend({ t: 'draw_accept' }); return this._fEnd('drawn', 'agreed'); }
      g.drawOffer = 'me'; this._fSend({ t: 'draw_offer' }); return this._fPush();
    }
    g.drawOffer = 'me'; this._fPush();
    setTimeout(() => {                                         // the pretend friend says yes once the game is a little way in
      if (this.fr.game !== g || g.status !== 'active' || g.drawOffer !== 'me') return;
      if (g.moves.length >= 12) this._fEnd('drawn', 'agreed');
      else { g.drawOffer = null; this._fPush(); this.emit({ t: 'error', error: t('{name} wants to keep playing.', { name: this.FRIEND.name }) }); }
    }, 1400);
  },
  friendRematch(id){
    const g = this.fr.game; if (!g || g.id !== id || g.status === 'active') return;
    if (g.peer){
      if (g.oppLeft){ this.emit({ t: 'error', error: t('{name} has left.', { name: g.opp.name }) }); return; }
      this._fSend({ t: 'rematch' });
      if (g.rematch === 'opp') return this._fRematchGo();
      g.rematch = 'me'; return this._fPush();
    }
    g.rematch = 'me'; this._fPush();
    setTimeout(() => { if (this.fr.game === g) this._fStart(g.game, g.my === 'w' ? 'b' : 'w'); }, 1500);
  },
  friendLeave(){
    const g = this.fr.game; if (!g || g.status === 'active') return;
    if (this.fr.session){ this.fr.session.end({ t: 'bye' }); this.fr.session = null; }
    this.fr.game = null;
  },
  friendSync(){ this._fPush(); },
  sync(){
    const a = LocalBackend._me(), m = a && a.active;
    if (m) this.emit({ t: 'match', match: this._view(a, m) });
  },
  async active(){
    const a = LocalBackend._me(), m = a && a.active;
    if (m && m.status === 'active'){
      if (m.peer && !(this._session && this._session.id === m.id && !this._session.ended)) this._resumePeer(a, m);
      this._tick(); return this._view(a, m);
    }
    return null;
  }
});

let Backend = LocalBackend, Live = LocalLive;
async function initBackend(){

  return Backend;

<script>/* public/js/p2p.js */
/* Copyright (c) 2026 Abbel Dawit. All rights reserved. King Safari — proprietary and confidential; see LICENSE and NOTICE. */
/* King Safari — online play without a King Safari server, through PeerJS (WebRTC data channels).
   Used by the stand-alone build (LocalLive) so ranked tables and Play Friends reach real people on other phones.
   The real app uses its own server (RemoteLive) and never loads this.

   Privacy: PeerJS is loaded only when the player starts an online search or makes a friend code, never before.
   The PeerJS signalling server (0.peerjs.com) only introduces the two phones; after that they talk directly, or
   through a PeerJS relay when a network blocks direct connections. Only the display name, animal, rating, account
   kind (junior or adult) and the moves are sent. Never the phone number, date of birth, balance or anything else.
   A direct connection lets each phone see the other's IP address, as any online game does; the Privacy Policy says so.

   Matchmaking: each table (game + stake) has a few well-known lobby names. A searching player first knocks on each
   one; whoever answers there and is within the rating window starts a match with them. If a lobby name is free, the
   player sits in it for a while and waits to be found, then looks around again. Once matched, the lobby name is
   freed for the next players, and the game goes on over the same connection.
   Reconnecting: both phones keep a personal peer id; if the connection drops, each keeps dialling the other. */
"use strict";
const P2P = (() => {
  const PROTO = 1, PREFIX = 'kingsafari-v12-', SLOTS = 3;
  const SOURCES = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
                   'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
                   'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
  const OPTS = { debug: 0 };                       // PeerJS defaults: its public server, Google STUN and the PeerJS TURN relays
  const pause = ms => new Promise(r => setTimeout(r, ms));
  const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n || 8)), b => (b % 36).toString(36)).join('');
  let loading = null, main = null, mainOpening = null, sessions = new Map();

  /* ---------- loading PeerJS, lazily ---------- */
  function addScript(src){
    return new Promise(res => {
      const el = document.createElement('script'); let done = false;
      const end = ok => { if (done) return; done = true; if (!ok) el.remove(); res(ok && typeof window.Peer === 'function'); };
      el.src = src; el.async = true; el.crossOrigin = 'anonymous';
      el.onload = () => end(true); el.onerror = () => end(false);
      document.head.appendChild(el);
      setTimeout(() => end(typeof window.Peer === 'function'), 9000);
    });
  }
  function load(){
    if (typeof window.Peer === 'function') return Promise.resolve(true);
    if (!window.RTCPeerConnection) return Promise.resolve(false);
    if (loading) return loading;
    loading = (async () => { for (const src of SOURCES){ if (await addScript(src)) return true; } loading = null; return false; })();
    return loading;
  }

  /* ---------- peers and connections ---------- */
  function open(id){
    return new Promise((resolve, reject) => {
      let p;
      try{ p = id ? new window.Peer(id, OPTS) : new window.Peer(OPTS); }catch(e){ return reject({ type: 'browser-incompatible' }); }
      const timer = setTimeout(() => fail({ type: 'timeout' }), 10000);
      const ok = () => { clean(); p.on('error', () => {}); resolve(p); };
      const fail = e => { clean(); try{ p.destroy(); }catch(_){} reject({ type: (e && e.type) || 'error' }); };
      const clean = () => { clearTimeout(timer); p.off('open', ok); p.off('error', fail); };
      p.on('open', ok); p.on('error', fail);
    });
  }
  /* this phone's own peer: the address the opponent dials to reconnect. reuse: try to get the same id back (after a reload). */
  async function me(reuse){
    if (main && !main.destroyed) return main;
    if (mainOpening) return mainOpening;
    mainOpening = (async () => {
      if (!(await load())) throw { type: 'unavailable' };
      for (let k = 0; reuse && k < 4; k++){
        try{ main = await open(reuse); break; }catch(e){ if (e.type !== 'unavailable-id') break; await pause(2000); }
      }
      if (!main || main.destroyed) main = await open();
      main.on('connection', incoming);
      main.on('disconnected', () => { setTimeout(() => { try{ if (main && !main.destroyed && main.disconnected) main.reconnect(); }catch(_){} }, 1500); });
      return main;
    })();
    try{ return await mainOpening; } finally { mainOpening = null; }
  }
  const myId = () => main && !main.destroyed ? main.id : null;
  const signallingDown = () => !main || main.destroyed || main.disconnected;
  function dial(peer, id, ms){
    return new Promise((resolve, reject) => {
      let conn;
      try{ conn = peer.connect(id, { reliable: true, serialization: 'json' }); }catch(e){ return reject({ type: 'error' }); }
      if (!conn) return reject({ type: 'error' });
      const timer = setTimeout(() => done(false, { type: 'timeout' }), ms || 6000);
      const onPeerErr = e => { if (e && e.type === 'peer-unavailable' && String(e.message || '').includes(id)) done(false, { type: 'peer-unavailable' }); };
      const onConnErr = e => done(false, { type: (e && e.type) || 'error' });
      const done = (ok, v) => {
        clearTimeout(timer); peer.off('error', onPeerErr); conn.off('error', onConnErr);
        if (ok) resolve(conn); else { try{ conn.close(); }catch(_){} reject(v); }
      };
      peer.on('error', onPeerErr); conn.on('error', onConnErr);
      conn.on('open', () => done(true));
    });
  }
  /* the next message on a connection (for handshakes) */
  function next(conn, ms){
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { conn.off('data', on); reject({ type: 'timeout' }); }, ms || 5000);
      const on = d => { const m = parse(d); if (!m || m.t === 'ping') return; clearTimeout(timer); conn.off('data', on); resolve(m); };
      conn.on('data', on);
    });
  }
  const parse = d => { if (typeof d === 'string'){ try{ return JSON.parse(d); }catch(e){ return null; } } return d && typeof d === 'object' ? d : null; };
  const send = (conn, m) => { try{ conn.send(m); return true; }catch(e){ return false; } };

  /* a live link: heartbeat every 2.5 s, dead after 9 s of silence */
  function link(conn, onMsg, onClose){
    let last = Date.now(), dead = false;
    const beat = setInterval(() => { if (Date.now() - last > 9000) return kill(); send(conn, { t: 'ping' }); }, 2500);
    const onData = d => { last = Date.now(); const m = parse(d); if (m && m.t !== 'ping') onMsg(m); };
    conn.on('data', onData); conn.on('close', () => kill()); conn.on('error', () => kill());
    function kill(quiet){
      if (dead) return; dead = true; clearInterval(beat); conn.off('data', onData);
      try{ conn.close(); }catch(_){}
      if (!quiet && onClose) onClose();
    }
    return { send: m => !dead && send(conn, m), close: () => kill(true), get alive(){ return !dead; } };
  }

  /* someone dialled this phone's own peer: a player coming back to a game */
  function incoming(conn){
    next(conn, 8000).then(m => {
      const s = m && m.t === 'rejoin' && sessions.get(m.id);
      if (!s || s.ended) return conn.close();
      send(conn, { t: 'rejoined', id: m.id });
      s.attach(conn);
    }).catch(() => { try{ conn.close(); }catch(_){} });
  }

  /* ---------- one game between two phones ----------
     onMsg(m): a message from the opponent · onDown(): the connection dropped · onUp(): it is back */
  function session(o){
    const s = {
      id: o.id, opp: o.oppPeerId, ended: false, lk: null, extra: o.extra || [], retryT: null,
      attach(conn){
        if (s.ended){ try{ conn.close(); }catch(_){} return; }
        const was = s.lk; if (was) was.close();
        const back = !!s.downAt; s.downAt = null;
        s.lk = link(conn, m => { if (!s.ended && m.t !== 'rejoined') o.onMsg(m); }, () => s.down());
        clearTimeout(s.retryT);
        if (back || o.resume){ o.resume = false; o.onUp && o.onUp(); }
      },
      send(m){ return !!(s.lk && s.lk.send(m)); },
      down(){
        if (s.ended) return;
        s.lk = null; s.downAt = s.downAt || Date.now();
        o.onDown && o.onDown();
        s.retry();
      },
      async retry(){
        clearTimeout(s.retryT);
        if (s.ended || (s.lk && s.lk.alive)) return;
        try{
          const p = await me();
          if (p.disconnected && !p.destroyed) try{ p.reconnect(); }catch(_){}
          const conn = await dial(p, s.opp, 5000);
          if (s.ended || (s.lk && s.lk.alive)){ conn.close(); return; }
          send(conn, { t: 'rejoin', id: s.id });
          const m = await next(conn, 5000);
          if (m && m.t === 'rejoined') s.attach(conn); else conn.close();
        }catch(e){}
        if (!s.ended && !(s.lk && s.lk.alive)) s.retryT = setTimeout(() => s.retry(), 3000);
      },
      end(farewell){
        if (s.ended) return;
        if (farewell) s.send(farewell);
        s.ended = true; clearTimeout(s.retryT);
        setTimeout(() => { if (s.lk) s.lk.close(); s.extra.forEach(p => { try{ p.destroy(); }catch(_){} }); }, 1500);
        sessions.delete(s.id);
      }
    };
    sessions.set(s.id, s);
    if (o.conn) s.attach(o.conn); else { s.downAt = Date.now(); o.resume = true; s.retry(); }
    return s;
  }

  /* ---------- ranked matchmaking ----------
     me: { name, avatar, rating }. Resolves { conn, id, my, opp:{name,avatar,rating}, oppPeerId, extra } or null if cancelled. */
  const slotId = (game, stake, k) => `${PREFIX}r-${game}-${stake}-${k}`;
  function findMatch(o){
    let cancelled = false, lobby = null;
    const handle = { cancel(){ cancelled = true; if (lobby){ try{ lobby.destroy(); }catch(_){} lobby = null; } } };
    const hello = () => ({ t: 'hello', v: PROTO, kind: 'ranked', game: o.game, stake: o.stake, name: o.me.name, avatar: o.me.avatar, rating: o.me.rating, peer: myId() });
    const close = (a, b) => Math.abs((+a || 0) - (+b || 0)) <= o.maxGap;
    handle.done = (async () => {
      const p = await me();
      while (!cancelled){
        let free = null;
        for (let k = 0; k < SLOTS && !cancelled; k++){
          let conn = null;
          try{
            conn = await dial(p, slotId(o.game, o.stake, k), 4500);
            send(conn, hello());
            const m = await next(conn, 5000);
            if (m.t === 'accept' && m.v === PROTO && m.id && !cancelled)
              return { conn, id: m.id, my: m.color === 'b' ? 'b' : 'w', opp: { name: m.name, avatar: m.avatar, rating: m.rating }, oppPeerId: m.peer, extra: [] };
            conn.close();
          }catch(e){
            if (conn) try{ conn.close(); }catch(_){}
            if (e && e.type === 'peer-unavailable' && free == null) free = k;
          }
        }
        if (cancelled) break;
        if (o.onLook) o.onLook();
        if (free == null){ await pause(1500 + Math.random() * 1500); continue; }
        try{ lobby = await open(slotId(o.game, o.stake, free)); }catch(e){ lobby = null; await pause(400 + Math.random() * 800); continue; }
        // wait here to be found, then look around again
        const got = await new Promise(resolve => {
          let taken = false;
          const timer = setTimeout(() => resolve(null), 9000 + Math.random() * 6000);
          const stopCheck = setInterval(() => { if (cancelled){ clearTimeout(timer); clearInterval(stopCheck); resolve(null); } }, 300);
          lobby.on('connection', conn => {
            next(conn, 6000).then(m => {
              const ok = !taken && !cancelled && m.t === 'hello' && m.v === PROTO && m.kind === 'ranked' && m.game === o.game && m.stake === o.stake
                && m.peer && close(m.rating, o.me.rating);
              if (!ok){ send(conn, { t: 'reject', why: taken ? 'busy' : 'mismatch' }); setTimeout(() => conn.close(), 300); return; }
              taken = true; clearTimeout(timer); clearInterval(stopCheck);
              const id = 'p2p-' + rid(10), mine = Math.random() < .5 ? 'w' : 'b';
              send(conn, { t: 'accept', v: PROTO, id, color: mine === 'w' ? 'b' : 'w', name: o.me.name, avatar: o.me.avatar, rating: o.me.rating, peer: myId() });
              resolve({ conn, id, my: mine, opp: { name: m.name, avatar: m.avatar, rating: m.rating }, oppPeerId: m.peer });
            }).catch(() => { try{ conn.close(); }catch(_){} });
          });
        });
        if (got && !cancelled){
          const lb = lobby; lobby = null;
          try{ lb.disconnect(); }catch(_){}                 // free the lobby name; the game connection stays up
          got.extra = [lb];
          return got;
        }
        if (lobby){ try{ lobby.destroy(); }catch(_){} lobby = null; }
      }
      return null;
    })();
    return handle;
  }

  /* ---------- Play Friends: the code is the meeting point ---------- */
  const friendId = code => `${PREFIX}f-${String(code).toUpperCase()}`;
  /* host a code. onPeek(m) -> invite info to send back; onJoin(m) -> { start } to send, or { refuse } */
  async function hostFriend(code, h){
    await me();
    const lobby = await open(friendId(code));
    let used = false;
    lobby.on('connection', conn => {
      const onData = d => {
        const m = parse(d); if (!m || m.t === 'ping') return;
        if (m.v !== PROTO){ send(conn, { t: 'refuse', why: 'version' }); return; }
        if (m.t === 'peek'){ send(conn, Object.assign({ t: 'invite' }, h.onPeek(m))); return; }
        if (m.t === 'join'){
          if (used){ send(conn, { t: 'refuse', why: 'used' }); return; }
          const r = h.onJoin(m);
          if (r.refuse){ send(conn, { t: 'refuse', why: r.refuse }); return; }
          used = true; conn.off('data', onData);
          send(conn, Object.assign({ t: 'start', v: PROTO, peer: myId() }, r.start));
          try{ lobby.disconnect(); }catch(_){}               // a code works once
          h.onStart(conn, r, m, lobby);
        }
      };
      conn.on('data', onData);
    });
    return { stop(){ if (!used) try{ lobby.destroy(); }catch(_){} } };
  }
  /* knock on a friend's code: resolves { conn, invite } — the connection stays open for join() */
  async function peekFriend(code, mine){
    const p = await me();
    const conn = await dial(p, friendId(code), 7000);
    send(conn, Object.assign({ t: 'peek', v: PROTO }, mine));
    const m = await next(conn, 6000);
    if (m.t !== 'invite'){ conn.close(); throw { type: m.why || 'refused' }; }
    return { conn, invite: m };
  }
  async function joinFriend(conn, mine){
    send(conn, Object.assign({ t: 'join', v: PROTO, peer: myId() }, mine));
    const m = await next(conn, 8000);
    if (m.t !== 'start'){ conn.close(); throw { type: m.why || 'refused' }; }
    return m;
  }

  return { load, me, myId, signallingDown, session, findMatch, hostFriend, peekFriend, joinFriend, available: () => typeof window.Peer === 'function' };
})();

<script>/* public/js/superapp.js */

/* King Safari inside the telebirr SuperApp (Ethio Telecom Game Center).

   The SuperApp opens King Safari as an H5 page and gives it window.consumerapp. Two native functions are used:
     js_fun_h5GetAccessToken  { appId, functionCallBackName }  -> callback(paymentToken)
         the player's payment token: the server turns it into who they are (telebirr AuthToken) and whether they
         may play (Game Center checkPaymentStatus)
     js_fun_start_pay         { rawRequest, functionCallBackName } -> callback(result)
         telebirr's own payment sheet for an in-app order (token packs bought inside the SuperApp)
   Each call gets its own callback name; the SuperApp calls window[that name] when it is done.

   For testing without the SuperApp (development and staging only, when the server says so), open the app with
   ?superapp=mock: a pretend SuperApp asks who is opening the app (phone, Paid/Trial/Unpaid) and simulates both
   functions. It can never switch on in production: the server only allows it with the mock Game Center provider. */
"use strict";
const SuperApp = (function(){
  let mocked = false;
  const available = () => !!(window.consumerapp && typeof window.consumerapp.evaluate === 'function');

  function call(functionName, params, timeoutMs){
    return new Promise((resolve, reject) => {
      if (!available()) return reject(Object.assign(new Error(t('Open King Safari from the telebirr app.')), { code: 'not_superapp' }));
      const name = 'ksCb_' + functionName.replace(/\W/g, '') + '_' + Math.random().toString(36).slice(2, 8);
      const timer = setTimeout(() => { delete window[name]; reject(Object.assign(new Error(t('telebirr did not answer. Try again.')), { code: 'timeout' })); }, timeoutMs);
      window[name] = function(){ clearTimeout(timer); delete window[name]; resolve(arguments.length > 1 ? Array.from(arguments) : arguments[0]); };
      try{ window.consumerapp.evaluate(JSON.stringify({ functionName, params: { ...params, functionCallBackName: name } })); }
      catch(e){ clearTimeout(timer); delete window[name]; reject(e); }
    });
  }
  /* the answer may come as a string, a JSON string, or an object, depending on the SuperApp version */
  const unwrap = v => { if (typeof v === 'string'){ try{ const j = JSON.parse(v); if (j && typeof j === 'object') return j; }catch(e){} } return v; };

  async function getToken(){
    const appId = (CONFIG.gameCenter && CONFIG.gameCenter.appId) || '';
    const r = unwrap(await call('js_fun_h5GetAccessToken', { appId }, 15000));
    const token = typeof r === 'string' ? r : r && (r.token || r.paymentToken || r.access_token || (r.data && (r.data.token || r.data.paymentToken)));
    if (!token) throw Object.assign(new Error(t('telebirr did not answer. Try again.')), { code: 'no_token' });
    return String(token);
  }
  /* -> { ok, cancelled } */
  async function pay(rawRequest){
    const r = unwrap(await call('js_fun_start_pay', { rawRequest }, 10 * 60000));
    const code = r && typeof r === 'object' ? (r.code ?? r.resultCode ?? r.status) : r;
    return { ok: String(code) === '0' || /success/i.test(String(code)), cancelled: String(code) === '-2' || /cancel/i.test(String(code)), raw: r };
  }

  /* ---------- the pretend SuperApp (testing only) ---------- */
  function wantMock(){
    if (!(CONFIG.gameCenter && CONFIG.gameCenter.mockSuperApp) || available()) return false;
    const q = new URLSearchParams(location.search);
    try{ if (q.get('superapp') === 'mock') sessionStorage.setItem('ks:superapp', q.get('as') || '1'); return !!sessionStorage.getItem('ks:superapp'); }
    catch(e){ return q.get('superapp') === 'mock'; }
  }
  function pickIdentity(){
    return new Promise(resolve => {
      let preset = null; try{ preset = sessionStorage.getItem('ks:superapp'); }catch(e){}
      if (preset && preset !== '1') return resolve('mock:' + preset);       // ?as=251911223344:Paid:Abebe
      sheet(`<h2>${t('Pretend telebirr SuperApp')}</h2>
        <p class="muted">${t('Testing only. Choose who opens King Safari from the Game Center.')}</p>

  function mockPay(rawRequest){
    return new Promise(resolve => {
      const order = new URLSearchParams(rawRequest).get('mock_order');
      sheet(`<div class="tbr" style="margin-bottom:16px"><div class="logo">t</div><div style="flex:1"><b style="font-size:14px">${t('telebirr payment (test)')}</b></div></div>

        <button class="btn flat" id="mpNo" style="margin-top:8px">${t('Cancel')}</button>`, true);
      const done = async paid => {
        closeSheet();
        await fetch('/pay/mock/complete', { method: 'POST', redirect: 'manual', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ order, result: paid ? 'paid' : 'failed' }).toString() }).catch(() => {});

      };
      $('#mpOk').onclick = () => done(true); $('#mpNo').onclick = () => done(false);
    });

  function installMock(){
    if (mocked || !wantMock()) return false;
    mocked = true;
    window.consumerapp = { evaluate(json){
      const o = JSON.parse(json), cb = o.params && o.params.functionCallBackName;
      const answer = v => setTimeout(() => window[cb] && window[cb](v), 250);
      if (o.functionName === 'js_fun_h5GetAccessToken') pickIdentity().then(answer);
      else if (o.functionName === 'js_fun_start_pay') mockPay(o.params.rawRequest).then(r => answer(JSON.stringify(r)));
    } };
    return true;
  }

  return { available, getToken, pay, installMock, isMock: () => mocked };

const LESSON_STREAK = 3;                 // correct moves in a row
/* the rounds of a lesson: [{ start, steps }] — round r is played on rounds[r] */
function lessonRounds(game, i){
  const L = LESSONS[game][i], base = L.task.steps;
  const n = base.some(x => x.goal === 'promote') ? 1 : Math.ceil(LESSON_STREAK / base.length);
  const alts = (LESSON_ALTS[game] || {})[i] || [];
  return Array.from({ length: n }, (_, r) => {
    const a = r === 0 ? null : alts[(r - 1) % (alts.length || 1)];
    if (!a) return { fen: L.fen, pos: L.pos, steps: base };
    return { fen: a.fen, pos: a.pos, steps: base.map((st, k) => Object.assign({}, st, (a.steps || [])[k] || {})) };
  });
}

          6-1 14-9 1-5 9-6 21-17 18-22` }
];
const CLASSICS = { chess: CHESS_CLASSICS, checkers: CHECKERS_CLASSICS };

/* square 1..32 -> our board index: row by row over the dark squares, starting at the top */
function numToIdx(n){ const k = n - 1, r = Math.floor(k / 4), p = k % 4; return r * 8 + ((r % 2 === 0) ? 2 * p + 1 : 2 * p); }

/* turn the written game into engine moves once, and remember where it starts */
function loadClassic(g, gameId){
  if (g.moves) return g;
  g.moves = [];
  if (gameId === 'chess'){
    let s = Chess.fromFEN(Chess.START);
    g.start = s;
    for (const t of g.pgn.replace(/\d+\./g, ' ').trim().split(/\s+/)){
      const m = Chess.legal(s, s.turn).find(x => Chess.san(s, x) === t);
      if (!m) break;
      g.moves.push({ m, san: t, n: s.full, turn: s.turn }); s = Chess.apply(s, m);
    }
    return g;
  }
  let s = { b: Checkers.start().b, turn: 'b', quiet: 0, full: 1 };     // in checkers, black moves first
  g.start = s;
  for (const t of g.pdn.trim().split(/\s+/)){
    const [a, b] = t.split(/[-x]/).map(Number);
    const from = numToIdx(a), to = numToIdx(b);
    const m = Checkers.legal(s).find(x => x.from === from && x.to === to);
    if (!m) break;
    g.moves.push({ m, san: t, n: s.full, turn: s.turn }); s = Checkers.apply(s, m);
  }
  return g;
}

/* Plays the classics one after another on a non-interactive board, with a card that follows the moves.
   The card is built once per game and then only updated, so nothing re-renders while a piece is moving. */
let heroStop = null;
function playClassics(boardEl, cardEl, gameId){
  if (heroStop) heroStop();
  const id = gameId || 'chess', Game = GAMES[id], list = CLASSICS[id];
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const board = new DomBoard(boardEl, id);
  let gi = Math.floor(Math.random() * list.length), ply = 0, s, timer = null, stopped = false;
  const game = () => loadClassic(list[gi], id);

  const buildCard = () => {
    if (!cardEl) return;
    const g = game();
    let rows = '';
    for (let i = 0; i < g.moves.length; i += 2){
      const a = g.moves[i], b = g.moves[i + 1];
      rows += `<div class="cl-row"><span class="n">${Math.floor(i / 2) + 1}.</span><span class="m future" data-p="${i}">${esc(a.san)}</span>` +
              (b ? `<span class="m future" data-p="${i + 1}">${esc(b.san)}</span>` : '<span></span>') + '</div>';
    }
    cardEl.innerHTML = `<div class="cl-top"><b>${esc(t(g.name))}</b><span>${esc(t(g.place))}</span></div>
      <div class="cl-players"><span class="cl-dot w"></span>${esc(t(g.white))}<span class="cl-vs">${t('vs')}</span><span class="cl-dot b"></span>${esc(t(g.black))}</div>
      <p class="cl-about">${esc(t(g.about))}</p>
      <div class="cl-list">${rows}</div>
      <div class="cl-now">${id === 'chess' ? t('Starting position. White moves first.') : t('Starting position. Black moves first.')}</div>`;
  };
  const updateCard = (label, note) => {
    if (!cardEl) return;
    const now = cardEl.querySelector('.cl-now'); if (now) now.innerHTML = label + (note || '');
    const list = cardEl.querySelector('.cl-list'); if (!list) return;
    const prev = list.querySelector('.m.cur'); if (prev) prev.classList.remove('cur');
    const cur = list.querySelector(`.m[data-p="${ply - 1}"]`);
    if (cur){
      cur.classList.remove('future'); cur.classList.add('cur');
      const target = cur.offsetTop - list.clientHeight / 2 + cur.offsetHeight;          // keep the current move in view,
      if (list.scrollHeight > list.clientHeight) list.scrollTo({ top: Math.max(0, target), behavior: reduce ? 'auto' : 'smooth' }); // without scrolling the page
    }
  };

  const start = () => {
    s = game().start; ply = 0;
    board.setPosition(s); board.setMarks({});
    buildCard();
    timer = setTimeout(step, reduce ? 4000 : 2400);
  };
  const step = () => {
    if (stopped) return;
    const g = game();
    if (ply >= g.moves.length){                                   // hold the final position, then the next game
      if (g.result) updateCard(`<b>${esc(t(g.result))}</b>`, '');
      gi = (gi + 1) % list.length;
      timer = setTimeout(start, 5500);
      return;
    }
    const { m, san, turn } = g.moves[ply++], before = s;
    s = Game.apply(s, m);
    if (reduce) board.setPosition(s); else board.animate(Game.anim(before, m), s);
    const st = Game.status(s);
    const paint = () => board.setMarks({ last: m, check: st.check && id === 'chess' ? Chess.kingIdx(s, Game.turnOf(s)) : null });
    reduce ? paint() : requestAnimationFrame(() => requestAnimationFrame(paint));   // never in the move's first frame
    const label = `<b>${Math.ceil(ply / 2)}.${turn === 'b' && id === 'chess' ? '..' : ''} ${esc(san)}</b>`;
    const who = turn === 'w' ? t('White') : t('Black');
    updateCard(label, st.over && st.winner ? ' — ' + (id === 'chess' ? t('checkmate. {side} wins.', { side: who }) : t('no moves left. {side} wins.', { side: who }))
      : (st.check ? ' — ' + t('check') : '') + `<span class="cl-count">${t('move {n} of {total}', { n: Math.ceil(ply / 2), total: Math.ceil(g.moves.length / 2) })}</span>`);
    timer = setTimeout(step, reduce ? 2600 : (st.check ? 1700 : 1250));
  };
  start();
  heroStop = () => { stopped = true; clearTimeout(timer); heroStop = null; };
  return heroStop;
}
