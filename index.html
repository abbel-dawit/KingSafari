/* QR codes, drawn in the browser with no library and no network (the invite to a friend game is a link in a QR code).
   Byte mode, error correction level M (15% of the code can be damaged or covered and it still scans), versions 1 to 10
   (up to 213 bytes, far more than an invite link needs). Follows ISO/IEC 18004.
     QR.svg(text, { size, dark, light })  -> an SVG string, with the 4-module quiet zone around it
     QR.matrix(text)                      -> rows of booleans (true = dark), without the quiet zone */
"use strict";
const QR = (function(){
  // level M, versions 0..10 (index 0 unused): error-correction codewords per block, and number of blocks
  const ECC_PER_BLOCK = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const BLOCKS        = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const FORMAT_M = 0;                                   // the two format bits for level M

  /* ---------- GF(256) and Reed-Solomon ---------- */
  function mul(x, y){
    let z = 0;
    for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
    return z & 0xFF;
  }
  function divisor(degree){
    const r = new Array(degree).fill(0); r[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++){
      for (let j = 0; j < degree; j++){ r[j] = mul(r[j], root); if (j + 1 < degree) r[j] ^= r[j + 1]; }
      root = mul(root, 0x02);
    }
    return r;
  }
  function remainder(data, div){
    const r = div.map(() => 0);
    for (const b of data){
      const f = b ^ r.shift(); r.push(0);
      div.forEach((c, i) => { r[i] ^= mul(c, f); });
    }
    return r;
  }

  /* ---------- sizes ---------- */
  const rawModules = v => {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2){ const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  };
  const dataCodewords = v => Math.floor(rawModules(v) / 8) - ECC_PER_BLOCK[v] * BLOCKS[v];
  function alignment(v){
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, size = v * 4 + 17;
    const step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const out = [6];
    for (let pos = size - 7; out.length < n; pos -= step) out.splice(1, 0, pos);
    return out;
  }

  /* ---------- encode ---------- */
  const utf8 = s => Array.from(new TextEncoder().encode(String(s)));

  function matrix(text){
    const bytes = utf8(text);
    let v = 1;
    for (; v <= 10; v++){ const countBits = v < 10 ? 8 : 16; if (4 + countBits + bytes.length * 8 <= dataCodewords(v) * 8) break; }
    if (v > 10) throw new Error('QR: text too long');
    const size = v * 4 + 17, cap = dataCodewords(v) * 8;
    // bit stream: mode (byte), count, data, terminator, padding
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
    const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));

    // split into blocks, add error correction, interleave
    const nb = BLOCKS[v], eccLen = ECC_PER_BLOCK[v], raw = Math.floor(rawModules(v) / 8);
    const short = nb - raw % nb, shortLen = Math.floor(raw / nb), div = divisor(eccLen), blocks = [];
    for (let i = 0, k = 0; i < nb; i++){
      const dat = data.slice(k, k + shortLen - eccLen + (i < short ? 0 : 1)); k += dat.length;
      const ecc = remainder(dat, div);
      if (i < short) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const words = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= short) words.push(b[i]); });

    // function patterns
    const M = Array.from({ length: size }, () => new Array(size).fill(false));
    const F = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, dark) => { M[y][x] = dark; F[y][x] = true; };
    for (let i = 0; i < size; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]])
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
      }
    const al = alignment(v), last = al.length - 1;
    al.forEach((ax, i) => al.forEach((ay, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
    const drawFormat = mask => {
      const d = FORMAT_M << 3 | mask; let r = d;
      for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = (d << 10 | r) ^ 0x5412, bit = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (v >= 7){
      let r = v; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = v << 12 | r;
      for (let i = 0; i < 18; i++){ const dark = ((b >>> i) & 1) === 1, a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, dark); set(c, a, dark); }
    }

    // data, in the zigzag order
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2){
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++){
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!F[y][x] && i < words.length * 8){ M[y][x] = ((words[i >>> 3] >>> (7 - (i & 7))) & 1) === 1; i++; }
      }
    }

    // try the eight masks and keep the one with the lowest penalty
    const MASKS = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, x => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const applyMask = k => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && MASKS[k](x, y)) M[y][x] = !M[y][x]; };
    let best = 0, bestScore = Infinity;
    for (let k = 0; k < 8; k++){
      applyMask(k); drawFormat(k);
      const s = penalty(M, size);
      if (s < bestScore){ bestScore = s; best = k; }
      applyMask(k);                                       // masks are their own inverse
    }
    applyMask(best); drawFormat(best);
    return M;
  }

  /* the standard's four penalty rules (runs, 2x2 blocks, finder-like patterns, dark/light balance) */
  function penalty(M, size){
    let score = 0, dark = 0;
    const line = get => {
      let run = 1;
      for (let i = 1; i <= size; i++){
        if (i < size && get(i) === get(i - 1)) run++;
        else { if (run >= 5) score += run - 2; run = 1; }
      }
      for (let i = 0; i + 7 <= size; i++){
        const p = [1, 0, 1, 1, 1, 0, 1].every((b, k) => get(i + k) === !!b);
        if (!p) continue;
        const lightBefore = [1, 2, 3, 4].every(k => i - k < 0 || !get(i - k)), lightAfter = [0, 1, 2, 3].every(k => i + 7 + k >= size || !get(i + 7 + k));
        if (lightBefore || lightAfter) score += 40;
      }
    };
    for (let y = 0; y < size; y++) line(x => M[y][x]);
    for (let x = 0; x < size; x++) line(y => M[y][x]);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){
      if (M[y][x]) dark++;
      if (x < size - 1 && y < size - 1 && M[y][x] === M[y][x + 1] && M[y][x] === M[y + 1][x] && M[y][x] === M[y + 1][x + 1]) score += 3;
    }
    const total = size * size, k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
    return score + Math.max(0, k) * 10;
  }

  function svg(text, opts){
    const o = opts || {}, M = matrix(text), n = M.length, q = 4, full = n + q * 2;
    let path = '';
    M.forEach((row, y) => row.forEach((d, x) => { if (d) path += `M${x + q} ${y + q}h1v1h-1z`; }));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${full} ${full}" ${o.size ? `width="${o.size}" height="${o.size}"` : ''} shape-rendering="crispEdges" role="img" aria-label="${o.label || 'QR code'}">` +
      `<rect width="${full}" height="${full}" fill="${o.light || '#fff'}"/><path d="${path}" fill="${o.dark || '#000'}"/></svg>`;
  }

  const API = { svg, matrix };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  return API;
})();

  try{ return await fn(); }
  catch(e){ toast(e.message || t('Something went wrong.')); beep('lose'); }
  finally{ if (document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = old; } }

function applyTheme(th){

const langSwitch = () => `<div class="lang-switch" role="group" aria-label="Language">${LANGS.map(l =>

/* sound: tiny synth, no assets.
   Every button, tab, switch, link and choice in the app taps (one listener for the whole page, so a new button can never
   be silent). A screen that already plays

let AC = null, lastTapAt = 0, acPrimed = false;

   background, or another app takes the audio (a call, music, a voice note), and only lets it start again during a
   touch or key press. A context created or resumed outside a touch stays silent, and a sound scheduled while it is
   still waking up gets cut. So: wake the audio on every touch, retry when the page comes back, rebuild a context that
   never wakes, and only play a sound once the context is actually running. */

  catch(e){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(_){ AC = null; } }

  }

    const stuck = ctx;
    setTimeout(() => { if (AC === stuck && stuck.state !== 'running' && !document.hidden){ try{ stuck.close(); }catch(e){} AC = null; } }, 1200);

function beep(type){
  if (!prefs.sound) return;
  try{
    const now = performance.now();
    if (type === 'tap'){ if (now - lastTapAt < 140) return; lastTapAt = now; }
    const ctx = audio(); if (!ctx) return;
    const play = () => {
      const seq = { move:[[520,.06]], cap:[[190,.1]], check:[[740,.08],[590,.12]],
                    win:[[523,.1],[659,.1],[784,.16]], lose:[[330,.14],[247,.2]],
                    coin:[[880,.06],[1175,.1]], tap:[[420,.03]] }[type] || [[440,.05]];
      const peak = .16;
      let tt = ctx.currentTime + .012;                 // a hair ahead, so the start of a short sound is never lost
      for (const [f, d] of seq){
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type === 'cap' ? 'triangle' : 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, tt);
        g.gain.exponentialRampToValueAtTime(peak, tt + .008);
        g.gain.exponentialRampToValueAtTime(.0001, tt + d);
        o.connect(g).connect(ctx.destination); o.start(tt); o.stop(tt + d + .02);
        tt += d * .85;
      }
    };
    if (ctx.state === 'running') return play();
    // waking up: play once it is running, unless that takes so long the sound would arrive late
    ctx.resume().then(() => { if (performance.now() - now < 350 && ctx.state === 'running') play(); }).catch(() => {});
  }catch(e){}
}
(function soundEverywhere(){
  const TAPPABLE = 'button, [role="button"], [role="tab"], [role="switch"], a[href], summary, select, label.agree, label.reason, label.photo-pick, input[type="checkbox"], input[type="radio"], .swatch';
  // click (not pointerdown) so keyboard presses tap too, and a disabled button stays silent
  document.addEventListener('click', e => {
    const el = e.target && e.target.closest && e.target.closest(TAPPABLE);
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    if (el.tagName === 'LABEL' && e.target !== el && /INPUT/.test(e.target.tagName)) return;   // the label's own click already tapped
    beep('tap');
  }, true);
  document.addEventListener('change', e => { if (e.target && e.target.tagName === 'SELECT') beep('tap'); }, true);
})();

function confetti(){
  const c = document.getElementById('fx'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#81B64C','#95C75E','#F7C631','#FFFFFF','#E4483C'];
  const bits = Array.from({length:110}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*220, y: innerHeight*.42,
    vx:(Math.random()-.5)*9, vy:-Math.random()*13-4, r:Math.random()*6+3,
    a:Math.random()*6, s:(Math.random()-.5)*.3, c:cols[Math.random()*cols.length|0]
  }));
  let f = 0;
  (function loop(){
    x.clearRect(0,0,c.width,c.height); f++;
    for (const b of bits){
      b.x += b.vx; b.y += b.vy; b.vy += .42; b.vx *= .995; b.a += b.s;
      x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillStyle = b.c;
      x.fillRect(-b.r, -b.r*.6, b.r*2, b.r*1.2); x.restore();
    }
    if (f < 150) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height);
  })();
}

/* Emoji avatars: every emoji font (Apple, Google, Microsoft…) paints its picture off-center, at a different
   size, and by a different amount. So draw each emoji once on a hidden canvas exactly as the page lays it out
   (line-height 1), find the painted pixels, then shift it to the true center and scale it to fill its circle.
   Cached per emoji and size. */
const EMOJI_FILL = .86;                    // how much of the box the animal should cover
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const emojiOffsets = new Map();
function emojiOffset(ch, px){
  const key = ch + '|' + px;
  if (emojiOffsets.has(key)) return emojiOffsets.get(key);
  let off = [0, 0, 1];
  try{
    const pad = Math.ceil(px / 2), size = Math.ceil(px * 2);
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.font = `${px}px ${EMOJI_FONT}`;
    const m = ctx.measureText(ch);
    if (m.fontBoundingBoxAscent != null){
      // where the browser puts the baseline inside a line-height:1 box of height px
      const base = (px - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(ch, pad, pad + base);
      const d = ctx.getImageData(0, 0, size, size).data;
      let x0 = size, y0 = size, x1 = -1, y1 = -1;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){
        if (d[(y * size + x) * 4 + 3] > 40){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      if (x1 >= 0){
        const inkX = (x0 + x1 + 1) / 2 - pad, inkY = (y0 + y1 + 1) / 2 - pad;
        const inkW = x1 - x0 + 1, inkH = y1 - y0 + 1;
        off = [m.width / 2 - inkX, px / 2 - inkY, Math.max(inkW, inkH) / px];
        if (!off.slice(0, 2).every(Number.isFinite) || Math.abs(off[0]) > px / 3 || Math.abs(off[1]) > px / 3) off = [0, 0, off[2]];
      }
    }
  }catch(e){ off = [0, 0, 1]; }
  emojiOffsets.set(key, off);
  return off;
}
function centerEmojis(root){
  (root || document).querySelectorAll('.av, .pick.avatars button').forEach(el => {
    if (el.querySelector('svg')) return;
    let span = el.querySelector(':scope > .emo');
    const ch = (span ? span.textContent : el.textContent).trim();
    if (!ch) return;
    if (!span){ el.textContent = ''; span = document.createElement('span'); span.className = 'emo'; span.textContent = ch; el.appendChild(span); }
    const cs = getComputedStyle(el), px = parseFloat(cs.fontSize);
    const box = Math.min(parseFloat(cs.width) || px, parseFloat(cs.height) || px);
    const [dx, dy, inkRatio] = emojiOffset(ch, px);
    const drawn = (inkRatio || 1) * px;                       // how big the picture really comes out
    const scale = Math.min(1.6, Math.max(1, (box * EMOJI_FILL) / (drawn || px)));
    span.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) scale(${scale.toFixed(3)})`;
  });
}

/* Boards are sized here, in pixels, from the space actually measured on screen. CSS does most of it, but
   screen-height units behave differently across browsers and inside embedded frames, so this is the final
   word: a board can never be wider than its column or taller than what is left of the screen. */
function fitBoard(boardEl, opts){
  if (!boardEl) return;
  const stage = boardEl.closest('.board-stage'), holder = (opts && opts.holder) || (stage && stage.parentElement);
  if (!stage || !holder) return;
  const side = 36;                                              // the coordinate margins around the board
  holder.style.width = '';                                      // measure the column as it is now, not as the last fit left it
  const column = Math.min((holder.parentElement || holder).clientWidth || innerWidth, innerWidth - 8);
  const below = (opts.below || []).reduce((n, el) => n + (el ? el.getBoundingClientRect().height + 10 : 0), 0);
  const top = stage.getBoundingClientRect().top;
  const byHeight = innerHeight - top - below - (opts.pad || 24);
  const size = Math.max(opts.min || 200, Math.min(column - side, opts.max || 620, byHeight));
  holder.style.width = Math.round(size + side) + 'px';
}
let fitting = null;
function refit(fn){                                             // re-measure after paint, and whenever the window changes
  if (fitting) removeEventListener('resize', fitting);
  fitting = () => requestAnimationFrame(fn);
  addEventListener('resize', fitting);
  requestAnimationFrame(() => requestAnimationFrame(fn));
}

const SCREENS = {};
/* Game Center: screens that need an active subscription (GAME_CENTER_GATE). Money already in the account can
   always be cashed out, and help, limits and the profile stay open. A ranked match in progress always finishes. */
const SUB_GATE = { all: new Set(['home', 'learn', 'lesson', 'bots', 'ranked', 'leaderboard', 'buy', 'game', 'friends']), ranked: new Set(['ranked', 'buy']) };
function subscriptionBlocks(name){
  const s = P && P.subscription, gate = CONFIG.gameCenter && CONFIG.gameCenter.enabled ? CONFIG.gameCenter.gate : 'off';
  if (!s || !s.enabled || s.active || !SUB_GATE[gate] || !SUB_GATE[gate].has(name)) return false;
  if (name === 'game' && typeof G !== 'undefined' && G && G.mode === 'ranked') return false;
  return true;
}
/* screens that need a complete profile (date of birth, current terms) before they open */
const GATED = new Set(['home', 'ranked', 'wallet', 'buy', 'cashout', 'you', 'learn', 'lesson', 'bots', 'leaderboard', 'limits', 'kyc', 'friends']);
/* Junior accounts (under 18): the money screens are replaced by a page saying when they open. Under 16, play waits for
   a parent's or guardian's consent; the profile, help, limits and the legal texts stay open. */
const JUNIOR_BLOCKED = new Set(['ranked', 'wallet', 'buy', 'cashout', 'kyc', 'leaderboard']);
const GUARDIAN_GATED = new Set(['home', 'learn', 'lesson', 'bots', 'game', 'friends']);
const awaitingGuardian = () => !!(P && P.junior && P.guardianRequired && !P.guardianConsented);
function go(name, data){
  if (typeof search !== 'undefined' && search) stopSearch();
  if (heroStop) heroStop();
  stopClock(); destroyBoards(); closeSheet();
  if (GATED.has(name) && P && P.name && needsDetails()){ data = { next: name, nextData: data }; name = 'complete'; }
  else if (P && P.name && awaitingGuardian() && GUARDIAN_GATED.has(name)){ data = { next: name }; name = 'guardian'; }
  else if (P && P.name && isJunior() && JUNIOR_BLOCKED.has(name)){ data = { from: name }; name = 'juniorLocked'; }
  else if (P && P.name && subscriptionBlocks(name)){ data = { next: name }; name = 'subscribe'; }
  view = { screen: name, data: data || {} };
  SCREENS[name]();
  wire();
}
function wire(){
  $$('[data-go]').forEach(el => el.onclick = () => { beep('tap'); go(el.dataset.go); });
  $$('[data-policy]').forEach(el => el.onclick = () => { beep('tap'); policySheet(); });

function wireDob(onChange){
  const box = $('.dob'), D = $('#dobD'), M = $('#dobM'), Y = $('#dobY'), hint = $('#dobHint');
  const now = new Date();
  const fill = () => {
    const cal = box.dataset.cal, keep = { d: D.value, m: M.value, y: Y.value };
    const top = cal === 'ec' ? gcToEc(now.getFullYear(), now.getMonth() + 1, now.getDate()).y : now.getFullYear();
    // from the youngest age that can open an account (a junior account), back 100 years
    Y.innerHTML = `<option value="">${t('Year')}</option>` + Array.from({ length: 100 }, (_, i) => top - Legal.JUNIOR_MIN_AGE - i).map(y => `<option>${y}</option>`).join('');
    M.innerHTML = `<option value="">${t('Month')}</option>` + (cal === 'ec' ? EC_MONTHS.map((m, i) => `<option value="${i + 1}">${LANG === 'am' ? m[0] : m[1]}</option>`)
      : (LANG === 'am' ? AM_MONTHS_GC : EN_MONTHS_GC).map((m, i) => `<option value="${i + 1}">${m}</option>`)).join('');
    if (keep.y) Y.value = keep.y; if (keep.m) M.value = keep.m;
    days(keep.d);
  };
  const days = keepD => {
    const cal = box.dataset.cal, y = +Y.value || 2000, m = +M.value || 1;
    const n = cal === 'ec' ? ecMonthDays(y, m) : new Date(Date.UTC(y, m, 0)).getUTCDate();
    D.innerHTML = `<option value="">${t('Day')}</option>` + Array.from({ length: n }, (_, i) => `<option>${i + 1}</option>`).join('');
    if (keepD && +keepD <= n) D.value = keepD;
    update();
  };
  const update = () => {
    const v = value();
    hint.textContent = v ? (box.dataset.cal === 'ec' ? t('Gregorian date: {d}', { d: v }) : '') : '';
    onChange(v);
  };
  /* the Gregorian date as YYYY-MM-DD, or null while incomplete */
  const value = () => {
    if (!(D.value && M.value && Y.value)) return null;
    const g = box.dataset.cal === 'ec' ? ecToGc(+Y.value, +M.value, +D.value) : { y: +Y.value, m: +M.value, d: +D.value };
    return iso(g);
  };
  $$('[data-cal-btn]').forEach(b => b.onclick = () => {
    // convert what was picked into the other calendar, so switching never loses the date
    const cur = value(); box.dataset.cal = b.dataset.calBtn;
    $$('[data-cal-btn]').forEach(x => x.setAttribute('aria-pressed', x === b));
    fill();
    if (cur){
      const [gy, gm, gd] = cur.split('-').map(Number), e = box.dataset.cal === 'ec' ? gcToEc(gy, gm, gd) : { y: gy, m: gm, d: gd };
      Y.value = e.y; M.value = e.m; days(String(e.d));
    }
  });
  Y.onchange = M.onchange = () => days(D.value);
  D.onchange = update;
  fill();
  return value;
}

/* The content rules (shared/moderation.js), checked as the player types, so they see the problem before sending.
   The server checks again and has the final word. field: 'name' | 'message' | 'legal'.
   Returns ok() -> true when the text is fine; the message appears under the input. */
function textGuard(input, field, onChange){
  if (!input) return () => true;
  let err = input.parentElement.querySelector('.field-err');
  if (!err){ err = document.createElement('p'); err.className = 'field-err'; err.setAttribute('role', 'alert'); err.hidden = true; input.insertAdjacentElement('afterend', err); }
  let bad = null, timer = null;
  const run = notify => {
    bad = typeof Moderation !== 'undefined' ? Moderation.check(input.value, field) : null;
    err.hidden = !bad; err.textContent = bad ? tServer(bad.message) : '';
    input.classList.toggle('inp-bad', !!bad); input.setAttribute('aria-invalid', bad ? 'true' : 'false');
    if (notify && onChange) onChange();
  };
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => run(true), 180); });
  input.addEventListener('blur', () => run(true));
  return () => { run(false); return !bad; };
}

  $$('[data-side]').forEach(el => el.onclick = () => {
    side = el.dataset.side; beep('tap');
    $$('[data-side]').forEach(x => x.setAttribute('aria-pressed', x === el));
  });
  $('#playbot').onclick = () => {
    lsSet('ks:lastBot', lv);
    startGame({ mode: 'bot', game: g, botLevel: lv, my: side === 'r' ? (Math.random() < .5 ? 'w' : 'b') : side });
  };
  sync();
};

/* ===== reality checks: every N minutes, how long you have played and how it has gone ===== */
const reality = (() => {
  let timer = null, since = Date.now(), minutes = 60, due = false;
  async function load(){ try{ minutes = (await Backend.limits()).realityMinutes; }catch(e){} }
  function tick(){
    if (!P || !minutes) return;
    if (Date.now() - since < minutes * 60000) return;
    if (typeof G !== 'undefined' && G && G.mode === 'ranked' && !G.over){ due = true; return; }     // never interrupt a ranked game
    show();
  }
  async function show(){
    due = false;
    const played = Math.round((Date.now() - since) / 60000);
    if (isJunior()){                                            // no tokens to report: just the time, and a nudge to rest
      sheet(`<div class="reality">${ICONS.heart}<h2>${t('Time check')}</h2>
        <p class="muted">${t('You have been playing for {n} minutes. A short break helps you think better in your next game.', { n: played })}</p>
        <div class="stack" style="margin-top:16px">
          <button class="btn go" id="rcGo">${t('Keep playing')}</button>
          <button class="btn" id="rcLimits">${t('Change my reminder')}</button>
        </div></div>`);
      $('#rcGo').onclick = () => { since = Date.now(); closeSheet(); };
      $('#rcLimits').onclick = () => { since = Date.now(); go('limits'); };
      return;
    }
    let a = { matches: 0, net: 0, bought: 0 };
    try{ a = await Backend.activity(since); }catch(e){}
    sheet(`<div class="reality">${ICONS.heart}<h2>${t('Time check')}</h2>
      <p class="muted">${t('You have been playing for {n} minutes.', { n: played })}</p>
      <div class="limits">
        <div><b>${a.matches}</b><span>${t('ranked matches')}</span></div>
        <div><b class="${a.net >= 0 ? 'amt up' : 'amt dn'}">${a.net >= 0 ? '+' : '−'}${fmt(Math.abs(a.net))}</b><span>${t('tokens won or lost')}</span></div>
        <div><b>${fmt(a.bought)}</b><span>${t('tokens bought')}</span></div>
      </div>
      <div class="stack" style="margin-top:16px">
        <button class="btn go" id="rcGo">${t('Keep playing')}</button>
        <button class="btn" id="rcLimits">${t('Set a limit or take a break')}</button>
      </div></div>`);
    $('#rcGo').onclick = () => { since = Date.now(); closeSheet(); };
    $('#rcLimits').onclick = () => { since = Date.now(); go('limits'); };
  }
  return {
    start(){ if (timer) return; since = Date.now(); load(); timer = setInterval(tick, 30000); },
    setMinutes(n){ minutes = n; },
    afterGame(){ if (due) show(); }
  };
})();

/* ===== errors in the browser are reported, so problems show up before players report them ===== */
(function(){
  let sent = 0;
  const report = (message, stack) => {
    if (sent++ >= 5 || Backend.mode !== 'remote') return;                // a few per visit is enough
    fetch('/api/client-errors', { method: 'POST', headers: { 'Content-Type': 'application/json',
      ...(RemoteBackend.token ? { Authorization: 'Bearer ' + RemoteBackend.token } : {}) },
      body: JSON.stringify({ message: String(message).slice(0, 500), stack: String(stack || '').slice(0, 4000), url: location.pathname }) }).catch(() => {});
  };
  addEventListener('error', e => { if (e.message && !/ResizeObserver|Script error/.test(e.message)) report(e.message, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; if (r && !r.status) report(r.message || r, r.stack); });
})();

<script>/* public/js/game.js */

/* King Safari — the game screen.
   The same screen plays chess and checkers: it talks to GAMES[G.game], never to one game's rules.
   Bot and pass-and-play games run entirely in the browser.
   Ranked games are against another person. Moves go to the server over Live (a WebSocket);
   the server checks them, relays them to the opponent, runs both clocks and settles the stakes.
   The board shows your move straight away and corrects itself if the server disagrees.
   Friend games (mode 'friend': junior with junior, adult with adult) travel the same way, without clocks, stakes, ratings or reports. */
"use strict";

let G = null, clockT = null;

const GM = () => GAMES[(G && G.game) || 'chess'];
const other = c => c === 'w' ? 'b' : 'w';
const sideName = c => c === 'w' ? t('White') : t('Black');
/* pieces removed by a move, from the game's own animation description */
const capturedBy = (Game, before, m) => Game.anim(before, m).removes.map(i => before.b[i]).filter(Boolean);

/* rebuild the move list, captures and last move from a UCI history (resuming, or resyncing with the server) */
function fromHistory(uciList, gameId){
  const Game = GAMES[gameId || 'chess'];
  let s = Game.start();
  const moves = [], taken = {w:[], b:[]}; let last = null;
  for (const u of uciList){
    const m = Game.fromUci(s, u); if (!m) break;
    moves.push({ san: Game.san(s, m), n: s.full, turn: Game.turnOf(s), uci: Game.toUci(m) });
    for (const p of capturedBy(Game, s, m)) taken[other(p[0])].push(p);
    last = m; s = Game.apply(s, m);
  }
  return { s, moves, taken, last };
}

function startGame(cfg){
  const gameId = cfg.match ? cfg.match.game : (cfg.game || gameId0());
  const h = fromHistory(cfg.match ? cfg.match.moves : [], gameId);
  G = {
    game: gameId, mode: cfg.mode, botLevel: cfg.botLevel || 3, match: cfg.match || null, path: null,
    s: h.s, moves: h.moves, taken: h.taken, last: h.last, sel: null, over: false, offline: false, drawAsked: false,
    my: cfg.mode === 'local' ? 'both' : cfg.match ? cfg.match.my : (cfg.my || 'w'),
    flip: false, clock: null, tick: Date.now()
  };
  go('game');
}

function players(){
  const m = G.mode, bot = m === 'bot' ? GM().bots[G.botLevel-1] : null;
  const disc = c => artFor(GM().id, GM().id === 'chess' ? c + 'K' : c + 'M');
  return {
    me:  m === 'local' ? {name:t('White'), av:disc('w'), rt:''} : {name:P.name, av:P.avatar, rt:m === 'friend' ? '' : ST(G.game).rating, flag:true},
    opp: m === 'local' ? {name:t('Black'), av:disc('b'), rt:''}
       : m === 'friend' ? {name:G.match.opp.name, av:G.match.opp.avatar, rt:'', flag:true, computer:!!G.match.opp.computer}
       : bot ? {name:t(bot.name), av:bot.emoji, rt:bot.rating}
             : {name:tServer(G.match.opp.name), av:G.match.opp.avatar, rt:G.match.opp.rating, flag:!G.match.opp.computer, computer:!!G.match.opp.computer}
  };
}
/* when the move panel sits beside the board (desktop, or a phone held sideways); matches the CSS */
const GAME_WIDE = '(min-width:1040px), (min-width:640px) and (orientation:landscape) and (max-height:760px)';
function pbar(who, side){
  const [avId, tkId, clId] = side === 'me' ? ['av-bot','tk-bot','cl-bot'] : ['av-top','tk-top','cl-top'];
  return `<div class="pbar" id="pb-${side}">
    <span class="av" id="${avId}">${who.av}</span>
    <div class="who"><div class="line"><b>${esc(who.name)}</b>${who.rt ? `<span class="rt">(${who.rt})</span>` : ''}${who.flag ? `<span class="fl" aria-label="${t('Ethiopia')}">🇪🇹</span>` : ''}</div>
      <div class="line2">${who.computer ? `<span class="chip mini">${t('computer · demo')}</span>` : ''}
      ${side === 'opp' && (G.mode === 'ranked' || G.mode === 'friend') ? `<span class="chip off mini" id="opp-off" hidden>${t('offline')}</span>` : ''}
      <div class="taken" id="${tkId}"></div></div></div>
    ${G.mode === 'ranked' ? `<div class="clock" id="${clId}"><span class="clk-ic" aria-hidden="true">${ICONS.clock}</span><span class="clk-t">10:00</span></div>` : ''}
  </div>`;
}

SCREENS.game = () => {
  const m = G.mode, pl = players(), chess = GM().id === 'chess';
  const title = m === 'ranked' ? (chess ? t('Ranked Chess') : t('Ranked Checkers'))
    : m === 'friend' ? t('Play Friends') + ' · ' + gname(GM().id)
    : m === 'bot' ? t('vs {name}', { name: t(GM().bots[G.botLevel-1].name) })
    : t('Pass and play') + ' · ' + gname(GM().id);
  screen(`
  <header class="topbar game-top">
    <button class="icon-btn" id="quit" aria-label="${m === 'ranked' ? t('Resign') : t('Leave game')}">${ICONS.back}</button>
    <div class="title">${esc(title)}<div class="sub" id="statusline">${t('White to move')}</div></div>
    ${m === 'ranked' ? `<span class="tok-pill" title="${t('Prize pool')}">${coinSVG()}${G.match.pot}</span>` : ''}
  </header>
  <div class="game">
    <div class="game-main">
      ${pbar(pl.opp, 'opp')}
      <div class="board-stage"><div class="board" id="bd"></div>${m === 'ranked' ? '<div class="net-banner" id="netBanner" role="status" aria-live="polite" hidden></div>' : ''}</div>
      ${pbar(pl.me, 'me')}
    </div>
    <aside class="game-side" aria-label="${t('Moves')}">
      <div class="side-head"><b>${t('Moves')}</b><span id="statusline2">${t('White to move')}</span></div>
      <div class="moves" id="movelist"></div>
      ${m === 'ranked' ? `<div class="strips"><button class="fp-strip" data-policy>${ICONS.shield}<span><b>${t('Fair-play monitoring is on.')}</b>
        <span class="fp-more">${t('Cheating disables your account and phone number and forfeits your earnings.')}</span></span></button>
        <button class="fp-strip net" data-connrules>${ICONS.wifi}<span><b>${t('Stay connected.')}</b>
        <span class="fp-more">${t('A player whose connection drops has {n} seconds to reconnect, or forfeits.', { n: Rules.CONNECTION.GRACE_S })}</span></span></button></div>` : ''}
      <div class="actions">
        ${m === 'friend' ? `<button class="act danger" id="resign">${ICONS.flag}<span>${t('Resign')}</span></button>
                            <button class="act" id="drawb" aria-label="${t('Offer draw')}">${ICONS.draw}<span>${t('Draw')}</span></button>`
        : m !== 'ranked' ? `<button class="act" id="undo">${ICONS.undo}<span>${t('Undo')}</span></button>`
                         : `<button class="act danger" id="resign">${ICONS.flag}<span>${t('Resign')}</span></button>
                            <button class="act" id="drawb" aria-label="${t('Offer draw')}">${ICONS.draw}<span>${t('Draw')}</span></button>
                            <button class="act" id="reportb">${ICONS.report}<span>${t('Report')}</span></button>`}
        <button class="act" id="flipb" aria-label="${t('Flip board')}">${ICONS.flip}<span>${t('Flip')}</span></button>
        ${m === 'ranked' ? '' : `<button class="act" id="quit2">${ICONS.exit}<span>${t('Leave')}</span></button>`}
      </div>
    </aside>
  </div>`);

  G.board = createBoard($('#bd'), G.game);
  // the playing board gets the same treatment: never wider than the screen, never taller than what is left
  refit(() => {
    const main = $('.game-main'), game = $('.game'), wide = matchMedia(GAME_WIDE).matches;
    if (!main || !game) return;
    const side = $('.game-side'), stage = $('.board-stage', main), bd = $('#bd');
    // measure from the top of the game area (below the top bar and its padding), never from the board itself,
    // so the opponent's bar always keeps its distance from the top bar. Bars and labels change height with the
    // board's width, so settle in a couple of passes.
    let size = 0;
    for (let pass = 0; pass < 3; pass++){
      const bars = $$('.pbar', main).reduce((n, el) => n + el.getBoundingClientRect().height, 0);
      const labels = stage && bd ? Math.max(0, stage.getBoundingClientRect().height - bd.getBoundingClientRect().height) : 0;
      const sideH = (!wide && side) ? side.getBoundingClientRect().height + parseFloat(getComputedStyle(side).marginTop) : 0;
      const cs = getComputedStyle(game), r = game.getBoundingClientRect();
      const avail = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - bars - labels - sideH - 2;
      const sidePanel = side && wide ? side.getBoundingClientRect().width + 60 : 0;
      // the board takes every pixel it can: only the coordinate margins (left and bottom) and a hair of edge are left over
      const width = wide ? (innerWidth >= 1040 ? r.width - 420 : r.width - Math.max(sidePanel, 240) - 30) : innerWidth - 22;
      let next = Math.round(Math.max(wide && innerWidth >= 1040 ? 300 : innerHeight < 480 ? 150 : 220, Math.min(width, 920, avail)));
      // phones and tablets held upright: the board is never smaller than the one on the home screen, and never wider
      // than the screen (its coordinate labels included). If that leaves too little height, the game area scrolls.
      if (!wide){
        const home = innerWidth < 640 ? Math.min(innerWidth - 68, 524) : Math.min(480, (innerWidth - 100) / 1.5);
        next = Math.round(Math.min(Math.max(next, home), innerWidth - 36, 620));
      }
      if (next === size) break;
      size = next;
      game.style.setProperty('--bd', size + 'px');
      if (side) side.style.height = wide ? Math.round(main.getBoundingClientRect().height) + 'px' : '';
    }
  });
  G.flip = (G.my === 'b');
  G.board.setFlip(G.flip);
  G.board.setPosition(G.s);
  G.board.onSquare(onSquare);
  $('#flipb').onclick = () => { G.flip = !G.flip; G.board.setFlip(G.flip); orderBars(); refresh(); };
  $('#quit').onclick = leaveGame; if ($('#quit2')) $('#quit2').onclick = leaveGame;
  if ($('#undo')) $('#undo').onclick = undo;
  if ($('#resign')) $('#resign').onclick = confirmResign;
  if ($('#drawb')) $('#drawb').onclick = offerDraw;
  if ($('#reportb')) $('#reportb').onclick = () => G.reported ? toast(t('You have already reported this match.')) : reportSheet(G.match);
  refresh();
  if (m === 'ranked'){
    integrity.start(G.match.id);
    syncClock(G.match); startClock(); setOppOnline(G.match.oppOnline !== false);
    Live.sync();                                    // the opponent may have moved while the "match found" card was up
    if (G.match.status !== 'active') endRanked(G.match);
  }
  else if (m === 'friend'){
    setOppOnline(G.match.oppOnline !== false);
    Live.friendSync();
    if (G.match.status !== 'active') endFriend(G.match);
  }
  else maybeBotMove();
};
/* keep each player's bar next to their own pieces when the board flips */
function orderBars(){
  const main = $('.game-main'); if (!main) return;
  const stage = $('.board-stage', main), me = $('#pb-me'), them = $('#pb-opp');
  const meBottom = G.flip === (G.my === 'b');
  [meBottom ? them : me, stage, meBottom ? me : them].forEach(el => main.appendChild(el));
}

function myTurn(){
  if (G.over || ((G.mode === 'ranked' || G.mode === 'friend') && G.offline)) return false;
  if (G.mode === 'local') return true;
  return GM().turnOf(G.s) === G.my;
}
function onSquare(i){
  if (!G || !myTurn()) return;
  const Game = GM(), from = G.path ? G.path[0] : G.sel;
  if (from != null){
    const path = (G.path || [G.sel]).concat(i);
    const matches = Game.legal(G.s).filter(m => (m.path || [m.from, m.to]).slice(0, path.length).join() === path.join());
    const exact = matches.filter(m => (m.path || [m.from, m.to]).length === path.length);
    if (exact.length && exact[0].promo && Game.id === 'chess') return askPromotion(exact);
    if (exact.length && matches.length === exact.length) return playerMove(exact[0]);   // nothing longer to continue
    if (matches.length){ G.path = path; G.sel = path[path.length - 1]; beep('tap'); return refresh(); }
  }
  const p = G.s.b[i];
  if (p && p[0] === Game.turnOf(G.s) && G.sel !== i){
    const mine = Game.legal(G.s).filter(m => m.from === i);
    if (!mine.length){                                   // in checkers a jump elsewhere is compulsory
      const jumps = Game.legal(G.s).filter(m => m.caps && m.caps.length);
      if (jumps.length){
        toast(t('A jump is available, so you have to take it.'));
        G.sel = null; G.path = null; G.mustFrom = jumps.map(m => m.from);
        beep('lose'); return refresh();
      }
    }
    G.sel = i; G.path = null; G.mustFrom = null; beep('tap');
  }
  else { G.sel = null; G.path = null; G.mustFrom = null; }
  refresh();
}
function askPromotion(opts){
  const color = GM().turnOf(G.s);
  sheet(`<h2>${t('Promote your pawn')}</h2><p class="tiny">${t('Pick the piece it becomes.')}</p>
    <div class="pick" style="grid-template-columns:repeat(4,1fr); margin-top:14px">
      ${['Q','R','B','N'].map(x => `<button data-pr="${x}" aria-label="${t({Q:'Queen',R:'Rook',B:'Bishop',N:'Knight'}[x])}">${artFor('chess', color+x)}</button>`).join('')}
    </div>`);
  $$('[data-pr]').forEach(b => b.onclick = () => { closeSheet(); playerMove(opts.find(o => o.promo === b.dataset.pr)); });
}

function playerMove(m){
  const st = doMove(m);
  if (G.mode === 'ranked') return Live.move(G.match.id, GM().toUci(m));
  if (G.mode === 'friend') return Live.friendMove(G.match.id, GM().toUci(m));
  if (st.over) return endGame(st);
  maybeBotMove();
}

/* apply a move on screen and in G; returns the new status */
function doMove(m){
  const Game = GM(), before = G.s;
  const caps = capturedBy(Game, before, m);
  G.moves.push({ san: Game.san(before, m), n: before.full, turn: Game.turnOf(before), uci: Game.toUci(m) });
  for (const p of caps) G.taken[other(p[0])].push(p);
  G.s = Game.apply(before, m);
  G.board.animate(Game.anim(before, m), G.s);
  G.last = m; G.sel = null; G.path = null;
  const st = Game.status(G.s);
  beep(st.check ? 'check' : caps.length ? 'cap' : 'move');
  refresh();
  if (!st.over && st.check){
    const who = G.mode === 'local' ? t('{side} must respond', { side: sideName(Game.turnOf(G.s)) })
      : (Game.turnOf(G.s) === G.my ? t('Your king is attacked') : t('You have them in check'));
    announce(t(Game.checkText), 'check', who, 1100);
    const bd = $('#bd'); if (bd){ bd.classList.add('shake'); setTimeout(() => bd.classList.remove('shake'), 420); }
  }
  return st;
}

function undo(){
  if (!G.moves.length || G.over) return;
  if (G.mode === 'bot' && G.s.turn !== G.my) return;               // let the bot finish first
  const steps = G.mode === 'bot' ? Math.min(2, G.moves.length) : 1;
  const keep = G.moves.slice(0, G.moves.length - steps).map(x => x.uci);
  Object.assign(G, fromHistory(keep, G.game), { sel: null, path: null });
  G.board.setPosition(G.s); refresh();
  maybeBotMove();
}
function maybeBotMove(){
  if (G.over || G.mode !== 'bot' || GM().turnOf(G.s) === G.my) return;
  const g = G;
  setTimeout(() => {
    if (G !== g || G.over || GM().turnOf(G.s) === G.my) return;
    const m = GM().botMove(G.s, G.botLevel);
    if (!m) return;
    const st = doMove(m);
    if (st.over) endGame(st);
  }, 420 + Math.random() * 700);
}

/* ---------- fair-play integrity signals (ranked only) ----------
   Leaving the app or switching to another window on your own turn, a second King Safari tab, open developer
   tools, and a scripted browser are each reported to the server. None of these ends a game by itself: the
   server records them and the Fair Play Team weighs them with the engine analysis. */
const rankedLive = () => G && G.mode === 'ranked' && !G.over && G.match;
function leftOnMyTurn(){
  if (!rankedLive() || G.s.turn !== G.my || G.awayPly === G.moves.length) return;
  G.awayPly = G.moves.length; Live.away(G.match.id);
  G.leftCount = (G.leftCount || 0) + 1;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return leftOnMyTurn();
  integrity.warnOnReturn();
});
addEventListener('blur', () => { leftOnMyTurn(); if (rankedLive()) Live.signal(G.match.id, 'focus_lost'); });
addEventListener('focus', () => integrity.warnOnReturn());

const integrity = (() => {
  const tabId = Math.random().toString(36).slice(2);
  let chan = null, timer = null, matchId = null, warned = false;
  try{ chan = new BroadcastChannel('ks-tabs'); }catch(e){}
  if (chan) chan.onmessage = e => {
    const d = e.data || {};
    if (d.from === tabId) return;
    // another tab opened while this one is in a ranked match (or the other way round): both sides say so
    if (d.t === 'hello' && rankedLive()){ Live.signal(G.match.id, 'second_tab'); chan.postMessage({ t: 'busy', from: tabId }); }
    if (d.t === 'busy' && rankedLive()) Live.signal(G.match.id, 'second_tab');
  };
  if (chan) chan.postMessage({ t: 'hello', from: tabId });
  const devtoolsOpen = () => {
    if (matchMedia('(pointer:coarse)').matches) return false;            // phones: window sizes do not mean anything here
    return (outerWidth - innerWidth > 200) || (outerHeight - innerHeight > 260);
  };
  return {
    start(id){
      matchId = id; warned = false;
      clearInterval(timer);
      if (navigator.webdriver) Live.signal(id, 'automation');
      if (chan) chan.postMessage({ t: 'hello', from: tabId });
      let sent = false;
      timer = setInterval(() => {
        if (!rankedLive() || G.match.id !== matchId){ clearInterval(timer); return; }
        if (!sent && devtoolsOpen()){ sent = true; Live.signal(matchId, 'devtools'); }
      }, 2000);
    },
    /* the first time a player comes back after leaving on their turn, say plainly that it was recorded */
    warnOnReturn(){
      if (!rankedLive() || warned || !G.leftCount) return;
      warned = true;
      toast(t('Leaving the game on your turn is recorded by fair-play monitoring.'));
    }
  };
})();

/* ---------- ranked: messages from the server ---------- */
function onLive(msg){
  if (msg.player) setPlayer(msg.player);
  switch (msg.t){
    case 'queued': case 'unqueued': case 'matched': if (typeof onMatchmaking === 'function') onMatchmaking(msg); break;
    case 'match': if (msg.match) applyServer(msg.match); break;
    case 'conncheck': if (typeof onMatchmaking === 'function') onMatchmaking(msg); break;
    case 'presence': if (G && G.match && msg.matchId === G.match.id && !G.over){
      G.match.oppOnline = msg.online;
      // the opponent's reconnection deadline, moved onto this device's clock
      G.oppGrace = !msg.online && msg.graceUntil ? Date.now() + (msg.graceUntil - (msg.serverNow || Date.now())) : null;
      if (!msg.online) beep('tap');
      if (msg.online && msg.back) toast(t('{name} is back. Play on.', { name: tServer(G.match.opp.name) }));
      setOppOnline(msg.online); netBanner();
    } break;
    case 'friend_start': onFriendStart(msg.match); break;
    case 'friend': if (G && G.mode === 'friend' && msg.match && G.match && msg.match.id === G.match.id) applyFriend(msg.match);
      if (typeof onFriendState === 'function') onFriendState(msg.match); break;
    case 'friend_invite': case 'friend_peek': if (typeof onFriendInvite === 'function') onFriendInvite(msg); break;
    case 'friend_presence': if (G && G.mode === 'friend' && G.match && msg.gameId === G.match.id && !G.over){
      G.match.oppOnline = msg.online; setOppOnline(msg.online);
      if (msg.online) toast(t('{name} is back.', { name: G.match.opp.name }));
      else toast(t('{name} lost connection. They have 10 minutes to come back.', { name: G.match.opp.name }));
    } break;
    case 'connection': if (G && G.mode === 'friend' && !G.over){
      const was = G.offline; G.offline = !msg.online;
      if (!G.offline && was) Live.friendSync();
      refresh();
    }
    if (G && G.mode === 'ranked' && !G.over){
      const was = G.offline; G.offline = !msg.online;
      if (G.offline) G.dropSince = G.dropSince || msg.since || Date.now();
      else { G.dropSince = null; if (was){ Live.sync(); setTimeout(() => { if (G && !G.over && !G.offline) toast(t('Reconnected. Play on.')); }, 700); } }
      refresh(); netBanner();
    } break;
    case 'error': toast(msg.error); if (msg.match) applyServer(msg.match);
      if (view.screen === 'friends' && /^friend_(invite|join|peek)$|^$/.test(msg.about || '')){ if ($('#fjYes')) closeSheet(); if (!friendState.invite) drawFriendInvite(); }
      break;
    case 'replaced': sessionElsewhere(); break;
    case 'session_ended': Backend.signOut().catch(() => {}); P = null; go('welcome'); toast(t('Your session has ended. Sign in again.')); break;
  }
}
function applyServer(r){
  if (!G || G.mode !== 'ranked' || !G.match || r.id !== G.match.id) return;
  G.match = r;
  const n = r.moves.length;
  if (n === G.moves.length + 1 && G.moves.every((x, i) => x.uci === r.moves[i])){   // the opponent moved
    const mv = GM().fromUci(G.s, r.moves[n - 1]); if (mv) doMove(mv);
  }
  if (G.moves.length !== n || G.moves.some((x, i) => x.uci !== r.moves[i])){       // out of step: the server is right
    Object.assign(G, fromHistory(r.moves, G.game), { sel: null, path: null }); G.board.setPosition(G.s);
  }
  if (r.oppOnline === false && r.oppGraceUntil) G.oppGrace = Date.now() + (r.oppGraceUntil - r.clock.serverNow);
  else if (r.oppOnline !== false) G.oppGrace = null;
  setOppOnline(r.oppOnline !== false);
  syncClock(r); refresh(); netBanner();
  if (r.drawOffer === 'opp' && !G.drawAsked && r.status === 'active'){ G.drawAsked = true; askDraw(); }
  if (r.drawOffer !== 'opp') G.drawAsked = false;
  if (r.status !== 'active') endRanked(r);
}
/* ---------- friend games (junior accounts) ---------- */
function applyFriend(r){
  G.match = r;
  const n = r.moves.length;
  if (n === G.moves.length + 1 && G.moves.every((x, i) => x.uci === r.moves[i])){ const mv = GM().fromUci(G.s, r.moves[n - 1]); if (mv) doMove(mv); }
  if (G.moves.length !== n || G.moves.some((x, i) => x.uci !== r.moves[i])){
    Object.assign(G, fromHistory(r.moves, G.game), { sel: null, path: null }); G.board.setPosition(G.s);
  }
  setOppOnline(r.oppOnline !== false); refresh();
  if (r.drawOffer === 'opp' && !G.drawAsked && r.status === 'active'){ G.drawAsked = true; askDraw(); }
  if (r.drawOffer !== 'opp') G.drawAsked = false;
  if (r.status !== 'active') endFriend(r);
  else if (G.rematchWait) G.rematchWait = false;
}
/* a friend game has started: from the waiting screen, or a rematch, or the friend joined while we were elsewhere */
function onFriendStart(match){
  if (!match) return;
  if (typeof friendState !== 'undefined'){ friendState.invite = null; friendState.active = match; }
  const busy = G && !G.over && G.mode !== 'friend' && view.screen === 'game';
  if (busy){
    sheet(`<h2>${t('{name} joined your game!', { name: esc(match.opp.name) })}</h2>
      <p class="muted">${t('Leave this game and play with your friend?')}</p>
      <div class="stack" style="margin-top:16px"><button class="btn go" id="fjGo">${t('Play with my friend')}</button>
      <button class="btn" data-close>${t('Not now')}</button></div>`);
    $('#fjGo').onclick = () => { closeSheet(); startGame({ mode: 'friend', match }); };
    return;
  }
  closeSheet(); beep('coin');
  startGame({ mode: 'friend', match });
  toast(match.my === 'w' ? t('You play White. Your move!') : t('You play Black. {name} moves first.', { name: match.opp.name }));
}
async function endFriend(r){
  if (G.over){ if (r.rematch === 'opp' && !G.rematchAsked){ G.rematchAsked = true; toast(t('{name} wants a rematch!', { name: r.opp.name })); const b = $('#again'); if (b) b.textContent = t('Accept the rematch'); } return; }
  G.over = true; refresh();
  if (r.status === 'abandoned'){
    sheet(`<div class="res-head draw"><div class="trophy">⏸️</div><div class="big">${t('Game ended')}</div>
        <p>${t('Nobody moved for a long time, so the game was closed.')}</p></div>
      <div class="stack" style="margin-top:14px"><button class="btn go" id="newf">${t('Play Friends')}</button>
      <button class="btn" id="homeb">${t('Back to home')}</button></div>`, true);
    $('#newf').onclick = () => { closeSheet(); Live.friendLeave(); G = null; go('friends'); };
    $('#homeb').onclick = () => { closeSheet(); Live.friendLeave(); G = null; go('home'); };
    return;
  }
  const won = r.status === 'won', draw = r.status === 'drawn';
  const body = `<div class="gain" style="grid-template-columns:1fr 1fr">${xpTile(r.xp || 0)}
      <div><b data-to="${P.level}">${P.level}</b><span>${t('Level')}</span></div></div>`;
  await celebrate(r.endReason, won, draw, won ? G.my : draw ? null : other(G.my));
  resultSheet({ title: won ? t('You won!') : draw ? t('Draw') : t('{name} won', { name: r.opp.name }), cls: won ? 'win' : draw ? 'draw' : 'lose',
    reason: t(GM().reason(r.endReason)), body: body + `<p class="tiny center" style="margin:10px 0 0">${t('Good game! Friend games are just for fun: no tokens and no rating.')}</p>`,
    meRt: '', meWon: won, oppWon: !won && !draw, won, draw,
    again: r.rematch === 'opp' ? t('Accept the rematch') : t('Rematch'),
    onAgain: () => { Live.friendRematch(r.id); G.rematchWait = true;
      sheet(`<div class="center"><div class="spinner" aria-hidden="true"></div><h2 style="margin-top:12px">${t('Waiting for {name}…', { name: esc(r.opp.name) })}</h2>
        <p class="muted">${t('The rematch starts when your friend taps Rematch too. You swap colors.')}</p></div>
        <div class="stack" style="margin-top:14px"><button class="btn" id="rmHome">${t('Back to home')}</button></div>`, true);
      $('#rmHome').onclick = () => { closeSheet(); Live.friendLeave(); G = null; go('home'); }; },
    onHome: () => Live.friendLeave() });
  reality.afterGame();
}

/* this account was opened in another tab or on another device; only one may be live at a time */
function sessionElsewhere(){
  sheet(`<h2>${t('Opened somewhere else')}</h2>
    <p class="muted">${t('King Safari is open on another device or in another tab with this account. Only one can be connected at a time, so a ranked match can never be played from two places.')}</p>
    <p class="tiny">${t('If this was not you, sign out on all devices from your profile.')}</p>
    <div class="stack" style="margin-top:16px"><button class="btn go" id="useHere">${t('Use King Safari here')}</button></div>`, true);
  $('#useHere').onclick = () => { closeSheet(); Live.reconnect(); };
}
function setOppOnline(on){ const el = $('#opp-off'); if (el) el.hidden = !!on; if (G) refresh(); }

/* ---------- connection: a drop, the reconnection countdown, and the return ----------
   Both players see it: the one who dropped ("come back within 52s"), and the opponent ("they have 52s, or you win").
   The server keeps the real deadline; these countdowns only show it. */
const secsLeft = until => Math.max(0, Math.ceil((until - Date.now()) / 1000));
function netBanner(){
  const el = $('#netBanner'); if (!el || !G) return;
  let html = '', cls = '';
  if (!G.over && G.offline){
    const n = secsLeft((G.dropSince || Date.now()) + Rules.CONNECTION.GRACE_S * 1000);
    cls = 'me';
    html = `<div class="nb-count" aria-hidden="true">${n}</div><div class="nb-txt"><b>${ICONS.wifiOff}${t('Connection lost — reconnecting…')}</b>
      <span>${n > 0 ? t('Come back within {n} seconds or you forfeit this match. Your clock keeps running.', { n })
        : t('The time to reconnect has run out. Still trying: you will see the result as soon as the connection is back.')}</span></div>`;
  } else if (!G.over && G.oppGrace && G.match.oppOnline === false){
    const n = secsLeft(G.oppGrace);
    cls = 'opp';
    html = `<div class="nb-count" aria-hidden="true">${n}</div><div class="nb-txt"><b>${ICONS.wifiOff}${t('{name} lost connection', { name: esc(tServer(G.match.opp.name)) })}</b>
      <span>${n > 0 ? t('They have {n} seconds to reconnect. If they do not return, they forfeit and you win.', { n }) : t('Time is up. Settling the match…')}</span></div>`;
  }
  el.hidden = !html;
  if (el.className !== 'net-banner ' + cls) el.className = 'net-banner ' + cls;
  if (html && el.innerHTML !== html) el.innerHTML = html;
}
function offerDraw(){
  if (!G || G.over) return;
  if (G.match.drawOffer === 'me') return toast(t('You have already offered a draw.'));
  if (G.mode === 'friend'){ Live.friendDraw(G.match.id); G.match.drawOffer = 'me'; return toast(t('Draw offered. Your friend can accept it or keep playing.')); }
  Live.draw(G.match.id); toast(t('Draw offered. Your opponent can accept it or keep playing.'));
}
function askDraw(){
  sheet(`<h2>${t('{name} offers a draw', { name: esc(tServer(G.match.opp.name)) })}</h2>
    <p class="muted">${G.mode === 'friend' ? t('If you accept, the game ends as a draw.') : t('If you accept, the game ends and both stakes of {n} tokens are returned.', { n: G.match.stake })}</p>
    <div class="stack" style="margin-top:16px">
      <button class="btn go" id="acc">${t('Accept the draw')}</button>
      <button class="btn" data-close>${t('Keep playing')}</button></div>`);
  $('#acc').onclick = () => { closeSheet(); G.mode === 'friend' ? Live.friendDraw(G.match.id) : Live.draw(G.match.id); };
}
function syncClock(r){
  G.offset = r.clock.serverNow - Date.now();              // server time minus ours, for the first-move countdown
  G.clock = { w: r.clock.w, b: r.clock.b };
  if (r.status === 'active') G.clock[r.turn] -= Math.max(0, r.clock.serverNow - r.clock.turnStartedAt);
  G.tick = Date.now(); drawClocks();
}
function drawClocks(){
  if (!G || !G.clock) return;
  const show = (ms, el) => {
    if (!el) return;
    const v = Math.max(0, ms), txt = Math.floor(v/60000) + ':' + String(Math.floor(v/1000) % 60).padStart(2,'0');
    const tx = el.querySelector('.clk-t') || el;
    if (tx.textContent !== txt) tx.textContent = txt;
    el.setAttribute('aria-label', t('Clock: {t}', { t: txt }));
    el.classList.toggle('low', v < 30000);
  };
  show(G.clock[G.my], $('#cl-bot')); show(G.clock[other(G.my)], $('#cl-top'));
}
function startClock(){
  stopClock();
  clockT = setInterval(() => {
    if (!G || G.over || !G.clock) return;
    const now = Date.now(); G.clock[GM().turnOf(G.s)] -= now - G.tick; G.tick = now;
    drawClocks(); statusLine(); netBanner();
  }, 250);
}
function stopClock(){ if (clockT){ clearInterval(clockT); clockT = null; } }

/* ---------- screen bits ---------- */
function refresh(){
  if (!G || !G.board) return;
  const Game = GM(), st = Game.status(G.s);
  const path = G.path || (G.sel != null ? [G.sel] : null);
  const hints = path ? Game.legal(G.s)
    .filter(m => (m.path || [m.from, m.to]).slice(0, path.length).join() === path.join())
    .map(m => ({ to: (m.path || [m.from, m.to])[path.length], cap: !!(m.cap || m.ep || (m.caps && m.caps.length)) }))
    .filter(h => h.to != null) : [];
  const mustHints = (!path && G.mustFrom) ? G.mustFrom.map(to => ({ to, cap: true })) : [];
  G.board.setMarks({ sel: G.sel, hints: hints.length ? hints : mustHints, last: G.last,
    check: st.check && Game.id === 'chess' ? Chess.kingIdx(G.s, Game.turnOf(G.s)) : null });
  statusLine();

  const ml = $('#movelist');
  if (ml){
    if (G.moves.length){
      let h = '';
      G.moves.forEach((x, i) => {
        if (x.turn === 'w' || i === 0){
          if (i) h += '</div>';
          h += `<div class="mrow"><span class="no">${x.n}.</span>${x.turn === 'b' ? '<span class="mv">…</span>' : ''}`;
        }
        h += `<span class="mv${i === G.moves.length - 1 ? ' cur' : ''}">${x.san}</span>`;
      });
      ml.innerHTML = h + '</div>';
    } else ml.innerHTML = `<span class="empty">${t('Tap a piece to start')}</span>`;
    ml.scrollLeft = ml.scrollWidth; ml.scrollTop = ml.scrollHeight;
  }

  const mine = G.my === 'b' ? 'b' : 'w', theirs = other(mine);
  const sum = l => l.reduce((a, p) => a + Game.value(p), 0);
  const adv = sum(G.taken[mine]) - sum(G.taken[theirs]);
  const drawTaken = (list, lead) => list.slice().sort((a, b) => Game.order(a) - Game.order(b)).map(p => artFor(Game.id, p)).join('')
    + (lead > 0 ? `<span class="adv">+${lead}</span>` : '');
  const topT = $('#tk-top'), botT = $('#tk-bot');
  if (botT) botT.innerHTML = drawTaken(G.taken[mine], adv);
  if (topT) topT.innerHTML = drawTaken(G.taken[theirs], -adv);

  const avT = $('#av-top'), avB = $('#av-bot');
  if (avT && avB){
    const myMove = Game.turnOf(G.s) === mine;
    avB.classList.toggle('on', myMove && !G.over); avT.classList.toggle('on', !myMove && !G.over);
    const cb = $('#cl-bot'), ct = $('#cl-top');
    if (cb){ cb.classList.toggle('on', myMove && !G.over); ct.classList.toggle('on', !myMove && !G.over); }
  }
}

/* checkers only: is the side to move obliged to jump? */
function mustJump(){
  if (!G || GM().id !== 'checkers') return false;
  return GM().legal(G.s).every(m => m.caps && m.caps.length) && GM().legal(G.s).length > 0 && GM().legal(G.s)[0].caps.length > 0;
}
function statusLine(){
  if (!G) return;
  let line;
  const jump = mustJump() ? t('Jump available — you must take it.') + ' ' : '';
  if (G.over) line = t('Game over');
  else if (G.mode === 'friend'){
    line = G.offline ? t('Reconnecting…') : GM().turnOf(G.s) === G.my ? jump + (GM().status(G.s).check ? t(GM().checkText) + ' ' : '') + t('Your move')
      : G.match.oppOnline === false ? t('{name} is offline. Waiting for them to come back…', { name: G.match.opp.name }) : t('Waiting for {name}…', { name: G.match.opp.name });
  }
  else if (G.mode !== 'ranked') line = jump + t('{side} to move', { side: sideName(GM().turnOf(G.s)) });
  else if (G.offline) line = t('Reconnecting… your clock keeps running');
  else if (G.oppGrace && G.match.oppOnline === false) line = t('{name} lost connection — {n}s left to reconnect', { name: tServer(G.match.opp.name), n: secsLeft(G.oppGrace) });
  else if (GM().turnOf(G.s) === G.my){
    const left = G.match.firstMoveBy ? Math.max(0, Math.ceil((G.match.firstMoveBy - (Date.now() + (G.offset || 0))) / 1000)) : null;
    line = (jump || (GM().status(G.s).check ? t(GM().checkText) + ' ' : '')) + (left != null ? t('Your move — {n}s to make your first move', { n: left }) : t('Your move'));
  } else line = G.match.oppOnline === false ? t('{name} is offline — their clock is running', { name: tServer(G.match.opp.name) })
    : t('Waiting for {name}…', { name: tServer(G.match.opp.name) });
  ['#statusline', '#statusline2'].forEach(q => { const el = $(q); if (el && el.textContent !== line) el.textContent = line; });
}

function announce(text, kind, sub, ms, icon){
  const stage = $('.game .board-stage') || $('.board-stage');
  if (!stage) return;
  const old = $('.ann', stage); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'ann ' + kind;
  el.innerHTML = `<div class="box">${icon ? `<div class="crown">${icon}</div>` : ''}
    <div class="pill">${text}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>`;
  stage.appendChild(el);
  if (ms) setTimeout(() => { el.classList.add('leave'); setTimeout(() => el.remove(), 300); }, ms);
}

/* ---------- leaving ---------- */
function leaveGame(){
  if (!G || G.over){ if (G && G.mode === 'friend') Live.friendLeave(); G = null; go('home'); return; }
  if (G.mode === 'friend'){
    sheet(`<h2>${t('Leave the game?')}</h2>
      <p class="muted">${t('Your friend can wait for you: come back from the home screen within 10 minutes to carry on. Or resign now and {name} wins.', { name: esc(G.match.opp.name) })}</p>
      <div class="stack" style="margin-top:18px">
        <button class="btn go" data-close>${t('Keep playing')}</button>
        <button class="btn" id="later">${t('Leave for now')}</button>
        <button class="btn flat danger" id="yes">${t('Resign')}</button></div>`);
    $('#later').onclick = () => { closeSheet(); G = null; go('home'); };
    $('#yes').onclick = () => { closeSheet(); Live.friendResign(G.match.id); };
    return;
  }
  if (G.mode === 'ranked'){
    const moved = G.moves.some(x => x.turn === G.my);
    if (!moved){
      sheet(`<h2>${t('Leave before your first move?')}</h2>
        <p class="muted">${t('You have not moved yet, so the match is canceled and both players get their {n} tokens back.', { n: G.match.stake })}</p>
        <div class="stack" style="margin-top:18px">
          <button class="btn go" id="yes">${t('Cancel the match')}</button>
          <button class="btn" data-close>${t('Stay and play')}</button></div>`);
      $('#yes').onclick = () => { closeSheet(); Live.abort(G.match.id); };
      return;
    }
    // A ranked match cannot be paused or left for later: the only way out is to resign. (Only a dropped internet
    // connection gets time to come back, and that is handled by the connection rules, not by this button.)
    return confirmResign();
  }
  if (!G.moves.length){ G = null; go('home'); return; }
  const label = G.mode === 'bot' ? t(GM().bots[G.botLevel-1].name) : t('this game');
  sheet(`<h2>${t('Quit the game?')}</h2>
    <p class="muted">${t('You are {n} moves into your game against {name}. Quitting ends it and the position is not saved.', { n: G.moves.length, name: esc(label) })}</p>
    <div class="stack" style="margin-top:18px">
      <button class="btn danger-fill" id="yes">${t('Quit the game')}</button>
      <button class="btn go" data-close>${t('Keep playing')}</button></div>`);
  $('#yes').onclick = () => { closeSheet(); G = null; go('home'); };
}
function confirmResign(){
  if (G.over) return;
  if (G.mode === 'friend'){
    sheet(`<h2>${t('Resign this game?')}</h2><p class="muted">${t('{name} wins this game.', { name: esc(G.match.opp.name) })} ${t('Resigning costs {n} XP.', { n: Math.abs(Rules.PENALTY_XP) })}</p>
      <div class="stack" style="margin-top:16px"><button class="btn danger-fill" id="yes">${t('Resign')}</button>
      <button class="btn go" data-close>${t('Keep playing')}</button></div>`);
    $('#yes').onclick = () => { closeSheet(); Live.friendResign(G.match.id); };
    return;
  }
  if (G.mode !== 'ranked') return;
  sheet(`<h2>${t('Resign this match?')}</h2>
    <p class="muted">${t('{name} takes the {pot}-token pool.', { name: esc(tServer(G.match.opp.name)), pot: G.match.pot })}</p>
    <p class="tiny">${t('A ranked match cannot be paused or left for later. Resigning also costs {n} XP.', { n: Math.abs(Rules.PENALTY_XP) })}</p>
    <div class="stack" style="margin-top:16px">
      <button class="btn danger-fill" id="yes">${t('Resign')}</button>
      <button class="btn go" data-close>${t('Keep playing')}</button></div>`);
  $('#yes').onclick = () => { closeSheet(); Live.resign(G.match.id); };
}

/* ---------- endings ---------- */
/* the XP tile on a result card: +5 for a win, 0 for a loss or a draw, -5 for resigning or a connection that did not come back */
const xpTile = xp => `<div><b class="${xp > 0 ? 'up' : xp < 0 ? 'dn' : ''}" data-to="${xp}" ${xp > 0 ? 'data-plus="1"' : ''}>${xp > 0 ? '+' + xp : xp}</b><span>XP</span></div>`;
async function endGame(st){                       // bot and pass-and-play
  if (G.over) return;
  G.over = true; refresh();
  const myWin = !!st.winner && (G.mode === 'local' || st.winner === G.my), draw = !st.winner;
  const pl = players(); let title, cls, body = '';
  if (G.mode === 'local'){
    title = draw ? t('Draw') : t('{side} won', { side: sideName(st.winner) }); cls = draw ? 'draw' : 'win';
  } else {
    const res = myWin ? 'W' : draw ? 'D' : 'L';
    let xp = Rules.botXP(G.botLevel, res), ups = 0;
    try{ const r = await Backend.botResult(G.game, G.botLevel, res); setPlayer(r.player); xp = r.xp; ups = r.levelsGained; }catch(e){}
    title = myWin ? t('You won!') : draw ? t('Draw') : t('{name} won', { name: pl.opp.name });
    cls = myWin ? 'win' : draw ? 'draw' : 'lose';
    body = `<div class="gain">${xpTile(xp)}
      <div><b data-to="${P.level}">${P.level}</b><span>${ups ? t('Level up!') : t('Level')}</span></div>
      <div><b data-to="${ST(G.game).botW}">${ST(G.game).botW}</b><span>${t('Bots beaten')}</span></div></div>`;
  }
  await celebrate(st.type, myWin || (G.mode === 'local' && !draw), draw, st.winner);
  resultSheet({ title, cls, reason: t(GM().reason(st.type)), body, meRt: pl.me.rt,
    meWon: G.mode === 'local' ? st.winner === 'w' : myWin, oppWon: G.mode === 'local' ? st.winner === 'b' : !!st.winner && !myWin,
    won: myWin || (G.mode === 'local' && !draw), draw,
    again: G.mode === 'bot' ? t('Rematch') : t('Play again'),
    onAgain: () => G.mode === 'bot' ? startGame({ mode:'bot', botLevel:G.botLevel, my:G.my }) : startGame({ mode:'local' }) });
}

async function endRanked(r){                      // the server has settled the match
  if (G.over) return;
  G.over = true; stopClock(); refresh();
  if (r.status === 'aborted'){
    beep('tap');
    sheet(`<div class="res-head draw"><div class="trophy">↩️</div><div class="big">${t('Match canceled')}</div>
        <p>${esc(tServer(r.endReason || 'before the first move'))}</p></div>
      <p class="muted center" style="margin-top:16px">${/connection/.test(r.endReason || '')
        ? t('Both players lost connection, so nobody is blamed: the match is canceled, both players got their {n} tokens back and ratings did not change.', { n: r.stake })
        : t('No game was played, so both players got their {n} tokens back and ratings did not change.', { n: r.stake })}</p>
      <div class="stack" style="margin-top:10px"><button class="btn go" id="again">${t('Find another opponent')}</button>
      <button class="btn" id="homeb">${t('Back to home')}</button></div>`, true);
    $('#homeb').onclick = () => { closeSheet(); G = null; go('home'); };
    $('#again').onclick = () => { closeSheet(); G = null; go('ranked'); };
    reality.afterGame();
    return;
  }
  const won = r.status === 'won', draw = r.status === 'drawn';
  const pl = players(), delta = r.ratingDelta || 0, payout = r.payout || 0;
  const xp = r.xp != null ? r.xp : Rules.rankedXP(won ? 'W' : draw ? 'D' : 'L', r.endReason);
  const body = `<div class="gain">
      <div><b class="${payout ? 'up' : ''}" data-to="${payout}" ${payout ? 'data-plus="1"' : ''}>${payout ? '+' + payout : '0'}</b><span>${t('Tokens')}${r.payoutBonus ? ' ' + t('({n} bonus)', { n: r.payoutBonus }) : ''}</span></div>
      <div><b class="${delta >= 0 ? 'up' : 'dn'}" data-to="${delta}" ${delta >= 0 ? 'data-plus="1"' : ''}>${delta >= 0 ? '+' : ''}${delta}</b><span>${t('Rating')}</span></div>
      ${xpTile(xp)}</div>
    ${won ? `<div class="note">${t('{n} tokens moved into your balance. Cash out to telebirr at 1 token = 1 birr.', { n: r.pot })}</div>` : ''}`;
  await celebrate(r.endReason, won, draw, won ? G.my : draw ? null : other(G.my));
  resultSheet({ title: won ? t('You won the pool!') : draw ? t('Draw') : t('{name} won', { name: tServer(r.opp.name) }), cls: won ? 'win' : draw ? 'draw' : 'lose',
    reason: t(GM().reason(r.endReason)), body, meRt: `${ST(G.game).rating} (${delta >= 0 ? '+' : ''}${delta})`,
    meWon: won, oppWon: !won && !draw, won, draw, again: t('Play another match'), onAgain: () => go('ranked'),
    report: r.opp && !r.opp.computer ? () => r : null });
  reality.afterGame();
}

/* One ending for every game and every mode: bots, pass and play, and ranked.
   A banner over the board first, then the result card. The words change, the show does not. */
const REASON_KEY = r => ({
  mate:'mate', checkmate:'mate', blocked:'blocked', 'no moves left':'blocked',
  stalemate:'stalemate', fifty:'fifty', '50-move rule':'fifty', quiet:'quiet', '40-move rule':'quiet',
  material:'material', 'insufficient material':'material', time:'time',
  time_vs_material:'time', 'time, but the opponent cannot win':'time',
  resign:'resign', resignation:'resign', agreed:'agreed', agreement:'agreed',
  cancel:'cancel', 'canceled before the first move':'cancel', abort:'cancel',
  fair_play:'fair_play', 'a fair-play violation':'fair_play',
  disconnect:'disconnect', 'a lost connection that was not restored in time':'disconnect',
  disconnect_vs_material:'disconnect', 'a lost connection, but the opponent cannot win':'disconnect'
}[r] || r);

function endingWords(key, kind, winner){
  const local = G.mode === 'local';
  const head = kind === 'draw' ? t('Draw') : local ? t('{side} wins!', { side: sideName(winner) }) : kind === 'win' ? t('You won!') : t('You lost');
  const sub = {
    mate: local ? t('Checkmate') : kind === 'win' ? t('Checkmate — you trapped the king') : t('Checkmate — your king is trapped'),
    blocked: local ? t('{side} has no moves left', { side: sideName(winner === 'w' ? 'b' : 'w') })
      : kind === 'win' ? t('Your opponent has no moves left') : t('You have no moves left'),
    stalemate: t('Stalemate — nobody can move'),
    fifty: t('The 50-move rule ends it'),
    quiet: t('Forty moves each with no capture'),
    material: t('Not enough pieces left to mate'),
    time: local ? t('Time is up') : kind === 'win' ? t('Your opponent ran out of time') : t('Your clock ran out'),
    resign: kind === 'win' ? t('Your opponent resigned') : t('You resigned'),
    agreed: t('You both agreed to a draw'),
    cancel: t('The match was canceled'),
    fair_play: kind === 'win' ? t('Your opponent was removed for a fair-play violation') : t('The match was ended by the Fair Play Team'),
    disconnect: kind === 'win' ? t('Your opponent lost connection and did not return in time')
      : kind === 'draw' ? t('A player lost connection, but the other could not win')
      : t('Your connection dropped and you did not return in time')
  }[key] || (kind === 'draw' ? t('The game is drawn') : t('The game is over'));
  return { head, sub };
}
/* a loss shows the white flag, in chess and checkers alike */
const LOSS_ICON = '🏳️';
async function celebrate(reasonRaw, won, draw, winner){
  const kind = draw ? 'draw' : won ? 'win' : 'lose';
  const { head, sub } = endingWords(REASON_KEY(reasonRaw), kind, winner);
  const icon = kind === 'win' ? '👑' : kind === 'draw' ? '🤝' : LOSS_ICON;
  announce(head, kind === 'win' ? 'mate' : kind, sub, null, icon);
  if (kind === 'win'){ confetti(); setTimeout(confetti, 550); }
  beep(kind === 'lose' ? 'lose' : 'win');
  await wait(kind === 'draw' ? 1500 : 1700);
  const ann = $('.ann');
  if (ann){ ann.classList.add('leave'); await wait(260); ann.remove(); }
}

/* count a number up from zero, so a win lands rather than just appearing */
function countUp(el, to, ms){
  const target = Number(to);
  if (!el || !Number.isFinite(target) || target === 0) return;
  const sign = target < 0 ? '-' : (el.dataset.plus ? '+' : '');
  const abs = Math.abs(target), t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / (ms || 700));
    el.textContent = sign + Math.round(abs * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function animateResultNumbers(){
  $$('.sheet .gain b[data-to]').forEach((el, i) => {
    const to = el.dataset.to;
    el.textContent = el.dataset.plus ? '+0' : '0';
    setTimeout(() => countUp(el, to, 750), 260 + i * 120);
  });
}

function resultSheet(o){
  const pl = players();
  const icon = o.won ? '🏆' : o.draw ? '🤝' : LOSS_ICON;
  sheet(`<div class="res-head ${o.cls}">
      <div class="trophy">${icon}</div><div class="big">${esc(o.title)}</div><p>${o.reason}</p></div>
    <div class="vs">
      <div><span class="av${o.meWon ? ' won' : ''}">${pl.me.av}</span><b>${esc(pl.me.name)}</b><span class="tiny">${o.meRt}</span></div>
      <div class="vs-x">${t('vs')}</div>
      <div><span class="av${o.oppWon ? ' won' : ''}">${pl.opp.av}</span><b>${esc(pl.opp.name)}</b><span class="tiny">${pl.opp.rt}</span></div>
    </div>
    ${o.body}
    <div class="stack" style="margin-top:16px">
      <button class="btn go" id="again">${o.again}</button>
      <button class="btn" id="homeb">${t('Back to home')}</button>
      ${o.report && !G.reported ? `<button class="btn flat" id="repb">${t('Report {name} for cheating or bad behavior', { name: esc(pl.opp.name) })}</button>` : ''}</div>`, true);
  animateResultNumbers();
  $('#homeb').onclick = () => { closeSheet(); if (o.onHome) o.onHome(); G = null; go('home'); };
  $('#again').onclick = () => { closeSheet(); o.onAgain(); };
  if ($('#repb')) $('#repb').onclick = () => reportSheet(o.report());
}

<script>/* public/js/screens.js */

/* ===== learn ===== */
SCREENS.learn = () => {
  const g = gameId0(), list = LESSONS[g], st = ST(g);
  const done = st.lessons.length, total = list.length;
  const PIECE_LESSONS = g === 'chess'
    ? [[1,'P','Pawn'],[2,'R','Rook'],[3,'B','Bishop'],[4,'N','Knight'],[5,'Q','Queen'],[6,'K','King']] : [];

  <div class="scroll"><div class="wrap" style="max-width:760px">
